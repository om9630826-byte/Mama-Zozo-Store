<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
  تفاصيل الطلب - مكتبة ماما زوزو
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:linear-gradient(
    135deg,
    #6c63ff,
    #8e7dff
  );
  color:white;
  padding:18px;
  box-shadow:0 3px 15px #0002;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

header h1{
  font-size:21px;
}

button{
  border:0;
  cursor:pointer;
  border-radius:10px;
  padding:11px 16px;
  font-weight:bold;
}

.back{
  background:white;
  color:#5c54dd;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.loading,
.error,
.not-found{
  background:white;
  border-radius:16px;
  padding:30px;
  text-align:center;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.order-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 18px #0000000d;
}

.full{
  grid-column:1/-1;
}

.card h2{
  font-size:18px;
  margin-bottom:16px;
  color:#4f46c5;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #eee;
  line-height:1.7;
}

.info-row:last-child{
  border-bottom:0;
}

.label{
  color:#777;
  font-size:14px;
}

.value{
  font-weight:bold;
  text-align:left;
}

/* =========================
   أزرار التواصل
========================= */

.contact-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.contact-btn{
  color:white;
  padding:10px 14px;
  text-decoration:none;
  display:inline-block;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
  border:0;
  cursor:pointer;
}

.call-btn{
  background:#2563eb;
}

.whatsapp-btn{
  background:#22c55e;
}

/* =========================
   الحالة
========================= */

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
}

.new{
  background:#fff3cd;
  color:#856404;
}

.preparing{
  background:#dbeafe;
  color:#1d4ed8;
}

.shipped{
  background:#e0e7ff;
  color:#4338ca;
}

.delivered{
  background:#dcfce7;
  color:#166534;
}

.cancelled{
  background:#fee2e2;
  color:#991b1b;

/* =========================
   الموقع
========================= */

.location-box{
  margin-top:15px;
  padding:16px;
  background:#f8f7ff;
  border:1px solid #e4e1ff;
  border-radius:14px;
}

.location-title{
  font-weight:bold;
  color:#4f46c5;
  margin-bottom:10px;
  font-size:16px;
}

.location-coordinates{
  color:#666;
  font-size:13px;
  line-height:1.8;
  direction:ltr;
  text-align:center;
  margin-bottom:12px;
}

.map-btn{
  display:block;
  width:100%;
  background:#22c55e;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.map-btn:hover{
  opacity:.9;
}

.no-location{
  color:#777;
  line-height:1.8;
}

/* =========================
   المنتجات
========================= */

.product{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.product:last-child{
  border-bottom:0;
}

.product-image{
  width:70px;
  height:70px;
  border-radius:12px;
  object-fit:cover;
  background:#f1f1f1;
  flex-shrink:0;
}

.product-info{
  flex:1;
}

.product-name{

  margin-bottom:7px;
  font-size:15px;
}

.product-meta{
  color:#777;
  font-size:13px;
  line-height:1.7;
}

.product-total{
  font-weight:bold;

}

.summary{
  margin-top:15px;
}

.summary-row{

  justify-content:space-between;
  padding:9px 0;
}

.grand-total{

  padding-top:15px;
  font-size:20px;

}

.actions{

  gap:10px;
  margin-top:18px;
}

.actions select{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  background:white;
}

.save-btn{

  color:white;
}

.empty-products{
  color:#777;
  text-align:center;
  padding:20px;
}

.products-error{
  background:#fff1f2;
  color:#be123c;
  padding:15px;
  border-radius:12px;
  line-height:1.8;
}

/* =========================
   موبايل
========================= */

@media(max-width:700px){

  .order-grid{
    grid-template-columns:1fr;
  }

  .full{

  }

<header>

  <div class="header-inner">

    <h1>
      📦 تفاصيل الطلب

<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://tzjtivfzawffqgisrowv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let orderId = null;
let currentOrder = null;


/* =========================
   أسماء الحالات
========================= */

const statusNames = {

  new:"جديد",

  preparing:"قيد التجهيز",

  shipped:"تم الشحن",

  delivered:"تم التسليم",

  cancelled:"ملغي"

};


/* =========================
   الحصول على رقم الطلب
========================= */

function getOrderId(){

  const params =
    new URLSearchParams(
      location.search
    );

  return params.get("id");
}


/* =========================
   التحقق من تسجيل الدخول
========================= */

async function checkUser(){

  const {
    data,
    error
  } =
  await supabaseClient
    .auth
    .getSession();

  if(error){

    console.error(error);

    showError(
      "حصل خطأ أثناء التحقق من تسجيل الدخول."
    );

    return false;
  }

  if(!data.session){

    location.href =
      "admin.html";

    return false;
  }

  return true;
}


/* =========================
   تحميل الطلب
========================= */

async function loadOrder(){

  orderId =
    getOrderId();

  if(!orderId){

    showError(
      "رقم الطلب غير موجود في الرابط."
    );

    return;
  }


  const {
    data: order,
    error: orderError
  } =
  await supabaseClient
    .from("orders")
    .select("*")
    .eq(
      "id",
      Number(orderId)
    )
    .single();


  if(orderError){

    console.error(
      "ORDER ERROR:",
      orderError
    );

    showError(
      "حصل خطأ أثناء تحميل بيانات الطلب:<br><br>" +
      escapeHtml(
        orderError.message
      )
    );

    return;
  }


  if(!order){

    showError(
      "الطلب غير موجود."
    );

    return;
  }


  currentOrder =
    order;


  /* =========================
     تحميل منتجات الطلب
  ========================= */

  const {
    data: items,
    error: itemsError
  } =
  await supabaseClient
    .from("order_items")
    .select(`
      id,
      order_id,
      product_id,
      product_name,
      price,
      quantity,
      products (
        image_url
      )
    `)
    .eq(
      "order_id",
      Number(orderId)
    )
    .order(
      "id",
      {
        ascending:true
      }
    );


  if(itemsError){

    console.error(
      "ITEMS ERROR:",
      itemsError
    );

    currentOrder.items =
      [];

    currentOrder.itemsError =
      itemsError.message;

  }else{

    currentOrder.items =
      Array.isArray(items)
        ? items.map(
            item => ({

              ...item,

              image_url:
                item.products &&
                item.products.image_url
                  ? item.products.image_url
                  : ""

            })
          )
        : [];

    currentOrder.itemsError =
      null;

  }


  renderOrder();

}


/* =========================
   استخراج موقع العميل
========================= */

function getLocationFromNotes(notes){

  if(!notes){

    return null;
  }


  /*
    الشكل المتوقع:

    موقع التوصيل: 30.123456, 31.123456
  */

  const match =
    notes.match(
      /موقع التوصيل\s*:\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i
    );


  if(!match){

    return null;
  }


  const lat =
    Number(match[1]);

  const lng =
    Number(match[2]);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    return null;
  }


  if(
    lat < -90 ||
    lat > 90 ||
    lng < -180 ||
    lng > 180
  ){

    return null;
  }


  return {

    lat,
    lng

  };

}


/* =========================
   عرض موقع العميل
========================= */

function renderLocation(order){

  const location =
    getLocationFromNotes(
      order.notes
    );


  if(!location){

    return `

      <div class="location-box">

        <div class="location-title">
          📍 موقع العميل
        </div>

        <div class="no-location">

          لم يتم تسجيل موقع العميل
          على الخريطة لهذا الطلب.

        </div>

      </div>

    `;

  }


  const lat =
    location.lat;

  const lng =
    location.lng;


  const googleMapsUrl =
    "https://www.google.com/maps?q=" +
    encodeURIComponent(
      lat + "," + lng
    );


  return `

    <div class="location-box">

      <div class="location-title">
        📍 موقع العميل
      </div>

      <div class="location-coordinates">

        خط العرض:
        ${escapeHtml(
          lat.toFixed(6)
        )}

        <br>

        خط الطول:
        ${escapeHtml(
          lng.toFixed(6)
        )}

      </div>

      <a
        class="map-btn"
        href="${googleMapsUrl}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍 فتح موقع العميل على الخريطة
      </a>

    </div>

  `;

}


/* =========================
   عرض الطلب
========================= */

function renderOrder(){

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="order-grid">


      <!-- =====================
           بيانات الطلب
      ====================== -->

      <div class="card">

        <h2>
          📋 بيانات الطلب
        </h2>


        <div class="info-row">

          <span class="label">
            رقم الطلب
          </span>

          <span class="value">
            #${escapeHtml(
              order.id
            )}
          </span>

        </div>


        <div class="info-row">

          <span class="label">
            تاريخ الطلب
          </span>

          <span class="value">
            ${escapeHtml(date)}
          </span>

        </div>


        <div class="info-row">

          <span class="label">
            الحالة
          </span>

          <span class="value">

            <span
              class="status ${escapeHtml(status)}"
            >

              ${escapeHtml(
                statusNames[status] ||
                status
              )}

            </span>

          </span>

        </div>


        <div class="info-row">

          <span class="label">
            طريقة الدفع
          </span>

          <span class="value">

            ${escapeHtml(
              order.payment_method ||
              "غير محدد"
            )}

          </span>

        </div>

      </div>


      <!-- =====================
           بيانات العميل
      ====================== -->

      <div class="card">

        <h2>
          👤 بيانات العميل
        </h2>


        <div class="info-row">

          <span class="label">
            الاسم
          </span>

          <span class="value">

            ${escapeHtml(
              order.customer_name ||
              "غير محدد"
            )}

          </span>

        </div>


        <div class="info-row">

          <span class="label">
            الهاتف
          </span>

          <span class="value">

            ${escapeHtml(
              order.phone ||
              "غير محدد"
            )}

          </span>

        </div>


        <!-- =====================
             أزرار التواصل
        ====================== -->

        <div class="info-row">

          <span class="label">
            📞 التواصل
          </span>

          <span class="value">

            <div class="contact-buttons">

              ${
                order.phone
                ?
                `
                <button
                  class="contact-btn call-btn"
                  onclick="callCustomer()"
                >
                  📞 اتصال
                </button>

                <button
                  class="contact-btn whatsapp-btn"
                  onclick="whatsappCustomer()"
                >
                  💬 واتساب
                </button>
                `
                :
                `
                <span
                  style="
                    color:#999;
                    font-size:13px;
                  "
                >
                  لا يوجد رقم هاتف
                </span>
                `
              }

            </div>

          </span>

        </div>


        <div class="info-row">

          <span class="label">
            المحافظة
          </span>

          <span class="value">

            ${escapeHtml(
              order.governorate ||
              "غير محدد"
            )}

          </span>

        </div>


        <div class="info-row">

          <span class="label">
            العنوان
          </span>

          <span class="value">

            ${escapeHtml(
              order.address ||
              "غير محدد"
            )}

          </span>

        </div>


        ${renderLocation(order)}

      </div>


      <!-- =====================
           المنتجات
      ====================== -->

      <div class="card full">

        <h2>
          🛍️ منتجات الطلب
        </h2>


        ${
          order.itemsError
          ?
          `

          <div class="products-error">

            ❌ حصل خطأ أثناء تحميل المنتجات:

            <br>

            ${escapeHtml(
              order.itemsError
            )}

          </div>

          `
          :
          items.length
          ?
          items.map(item => {

            const quantity =
              Number(
                item.quantity || 0
              );


            const price =
              Number(
                item.price || 0
              );


            const total =
              price * quantity;


            const image =
              getProductImage(item);


            return `

              <div class="product">

                <img
                  class="product-image"
                  src="${escapeHtml(image)}"
                  alt="${escapeHtml(
                    item.product_name ||

                  )}"
                  onerror="
                    this.onerror=null;
                    this.src='${getFallbackImage()}'

                >


                <div class="product-info">

                  <div class="product-name">

                    ${escapeHtml(
                      item.product_name ||
                      "منتج"
                    )}

                  </div>


                  <div class="product-meta">

                    الكمية:

                    <strong>
                      ${quantity}
                    </strong>

                    ×

                    ${price.toFixed(2)}

                <div class="product-total">

          }).join("")
          :
          `

        }


        <div class="summary">

            </span>

            <strong>

              ${Number(

              ).toFixed(2)}

              ج.م

            </strong>

          </div>


          <div class="summary-row">

            <span>
              الشحن
            </span>

            <strong>

              ${Number(
                order.shipping || 0
              ).toFixed(2)}

              ج.م

            </strong>

          </div>


          <div class="summary-row grand-total">

            <span>
              الإجمالي
            </span>

            <strong>

              ${Number(
                order.total || 0
              ).toFixed(2)}

              ج.م

            </strong>

          </div>


        </div>

      </div>


      <!-- =====================
           إدارة الطلب
      ====================== -->

      <div class="card full">

        <h2>
          ⚙️ إدارة الطلب
        </h2>


        ${
          order.notes
          ?
          `

          <div class="info-row">

            <span class="label">
              📝 ملاحظات العميل
            </span>

            <span class="value">

              ${escapeHtml(
                order.notes
              )}

            </span>

          </div>

          `
          :
          `

          <div
            style="
              color:#777;
              margin-bottom:10px;
            "
          >
            لا توجد ملاحظات من العميل.
          </div>

          `
        }


        <div class="actions">

          <select id="statusSelect">

            <option
              value="new"

            >
              🟡 جديد
            </option>


            <option
              value="preparing"
              ${status==="preparing"?"selected":""}
            >
              🔵 قيد التجهيز
            </option>


            <option
              value="shipped"
              ${status==="shipped"?"selected":""}

              🚚 تم الشحن
            </option>


            <option

            >
              🟢 تم التسليم
            </option>


            <option
              value="cancelled"

            >
              🔴 ملغي
            </option>

/* =========================
   صورة المنتج
========================= */

function getProductImage(item){

  if(
    item.image_url &&
    item.image_url.trim() !== ""
  ){

    return item.image_url;

  }

  return getFallbackImage();

}


/* =========================
   الصورة الافتراضية
========================= */

function getFallbackImage(){

  return "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100"
      >

        <rect
          width="100"
          height="100"
          rx="15"
          fill="#f1f1f1"
        />

        <text
          x="50"
          y="57"
          text-anchor="middle"
          font-size="35"
        >
          🛍️
        </text>

      </svg>

    `);

}


/* =========================
   رقم العميل
========================= */

function getCustomerPhone(){

  if(
    !currentOrder ||
    !currentOrder.phone
  ){

    return "";

  }

  return String(
    currentOrder.phone
  ).trim();

}


/* =========================
   الاتصال بالعميل
========================= */

function callCustomer(){

  const phone =
    getCustomerPhone();


  if(!phone){

    alert(
      "❌ رقم العميل غير موجود."
    );

    return;

  }


  window.location.href =
    "tel:" + phone;

}


/* =========================
   تحويل رقم واتساب
========================= */

function getWhatsAppPhone(phone){

  let clean =
    String(phone)
      .replace(
        /[^0-9+]/g,
        ""
      );


  /*

    01012345678
    ↓
    201012345678

  */

  if(
    clean.startsWith("0")
  ){

    clean =
      "20" +
      clean.substring(1);

  }


  /*

    +201012345678
    ↓
    201012345678

  */

  if(
    clean.startsWith("+")
  ){

    clean =
      clean.substring(1);

  }


  return clean;

}


/* =========================
   واتساب العميل
========================= */

function whatsappCustomer(){

  const phone =
    getCustomerPhone();


  if(!phone){

    alert(
      "❌ رقم العميل غير موجود."
    );

    return;

  }


  const whatsappPhone =
    getWhatsAppPhone(
      phone
    );


  if(
    !whatsappPhone
  ){

    alert(
      "❌ رقم الهاتف غير صالح."
    );

    return;

  }


  const order =
    currentOrder;


  const status =
    statusNames[
      order.status || "new"
    ] ||
    order.status ||
    "جديد";


  const customerName =
    order.customer_name ||
    "حضرتك";


  const total =
    Number(
      order.total || 0
    ).toFixed(2);


  const message =

`أهلاً ${customerName} 👋

معاك مكتبة ماما زوزو 📚🧸

بخصوص طلبك رقم #${order.id}:

📦 حالة الطلب: ${status}

💰 إجمالي الطلب: ${total} جنيه

شكراً لثقتك في مكتبة ماما زوزو ❤️`;


  const url =
    "https://wa.me/" +
    whatsappPhone +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );

}


/* =========================
   حفظ حالة الطلب
========================= */

async function saveStatus(){

  const select =
    document.getElementById(
      "statusSelect"
    );


  if(!select){

    return;

  }


  const newStatus =
    select.value;


  const {
    error
  } =
  await supabaseClient
    .from("orders")
    .update({

      status:
        newStatus

    })
    .eq(
      "id",
      Number(orderId)
    );


  if(error){

    console.error(
      "STATUS ERROR:",
      error
    );


    alert(
      "❌ حصل خطأ أثناء تحديث الحالة:\n\n" +
      error.message
    );


    return;

  }


  currentOrder.status =
    newStatus;


  renderOrder();


  alert(
    "✅ تم تحديث حالة الطلب بنجاح."
  );

}

      <button
        class="back"

      </button>

  `;

}


/* =========================
   حماية HTML
========================= */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
