<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>تعديل المنتج - مكتبة ماما زوزو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff4fb;
color:#39263d;
}

header{
background:linear-gradient(135deg,#ff69b4,#9b6cff);
color:white;
padding:22px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:18px;
}

.card{
background:white;
border-radius:18px;
padding:20px;
margin:15px 0;
box-shadow:0 5px 20px #0001;
}

input,
textarea,
select{

width:100%;
padding:12px;
margin:7px 0;

border:1px solid #ddd;
border-radius:10px;

font-size:15px;

}

textarea{
min-height:120px;
resize:vertical;
}

button{

border:0;
border-radius:10px;

padding:11px 16px;

cursor:pointer;

font-weight:bold;

margin:4px;

}

.primary{
background:#ff69b4;
color:white;
}

.blue{
background:#6c63ff;
color:white;
}

.green{
background:#20a464;
color:white;
}

.red{
background:#e74c3c;
color:white;
}

.gray{
background:#777;
color:white;
}

.row{

display:flex;
gap:12px;
flex-wrap:wrap;

}

.row>*{
flex:1;
min-width:200px;
}

.msg{

padding:12px;
border-radius:10px;
margin-top:10px;

}

.error{

background:#ffe0e0;
color:#a00000;

}

.success{

background:#dcffe9;
color:#087a35;

}

.loading{

text-align:center;
padding:25px;
font-size:18px;

}

/* الصور */

.images-grid{

display:grid;

grid-template-columns:
repeat(4,minmax(0,1fr));

gap:12px;

margin-top:15px;

}

.image-card{

border:1px solid #eee;

border-radius:14px;

padding:8px;

background:#fff;

text-align:center;

}

.image-card img{

width:100%;

height:150px;

object-fit:cover;

border-radius:10px;

}

.main-label{

background:#ff69b4;

color:white;

border-radius:8px;

padding:5px;

font-size:12px;

margin:6px 0;

display:inline-block;

}

.image-card button{

width:100%;

font-size:12px;

padding:8px;

}

/* الفيديو */

.video-box{

background:#faf5ff;

border-radius:15px;

padding:15px;

margin-top:15px;

}

.video-box video{

width:100%;

max-height:400px;

border-radius:12px;

}

/* موبايل */

@media(max-width:600px){

.container{
padding:10px;
}

.images-grid{

grid-template-columns:
repeat(2,minmax(0,1fr));

gap:9px;

}

.image-card img{

height:120px;

}

.row>*{

min-width:100%;

}

}

/* تابلت */

@media(min-width:601px) and (max-width:900px){

.images-grid{

grid-template-columns:
repeat(3,minmax(0,1fr));

}

}

</style>

</head>


<body>


<header>

<h1>🎀 مكتبة ماما زوزو</h1>

<p>تعديل المنتج</p>

</header>


<div class="container">


<!-- زر الرجوع -->

<div class="card">

<button
class="gray"
onclick="goBack()"
>
⬅️ الرجوع للمنتجات
</button>

</div>


<!-- تحميل -->

<div
id="loading"
class="card loading"
>

⏳ جاري تحميل المنتج...

</div>


<!-- صفحة المنتج -->

<div
id="editor"
class="hidden"
>


<!-- بيانات المنتج -->

<div class="card">

<h2>📦 بيانات المنتج</h2>


<label>
اسم المنتج
</label>

<input
id="name"
type="text"
placeholder="اسم المنتج"
>


<label>
الوصف
</label>

<textarea
id="description"
placeholder="وصف المنتج"
></textarea>


<div class="row">

<div>

<label>
السعر
</label>

<input
id="price"
type="number"
step="0.01"
>

</div>


<div>

<label>
السعر القديم
</label>

<input
id="old_price"
type="number"
step="0.01"
>

</div>

</div>


<div class="row">

<div>

<label>
المخزون
</label>

<input
id="stock"
type="number"
>

</div>


<div>

<label>
القسم
</label>

<select id="category">

<option value="">
اختر القسم
</option>

<option value="ألعاب">
ألعاب
</option>

<option value="أدوات مدرسية">
أدوات مدرسية
</option>

<option value="مستلزمات مدرسية">
مستلزمات مدرسية
</option>

<option value="أخرى">
أخرى
</option>

</select>

</div>

</div>


<div class="row">

<div>

<label>
حالة المنتج
</label>

<select id="is_active">

<option value="true">
🟢 نشط
</option>

<option value="false">
🔴 غير نشط
</option>

</select>

</div>


<div>

<label>
منتج مميز؟
</label>

<select id="is_featured">

<option value="false">
لا
</option>

<option value="true">
⭐ نعم
</option>

</select>

</div>

</div>


<button
class="green"
onclick="saveProduct()"
>
💾 حفظ تعديلات المنتج
</button>

<div id="saveMsg"></div>

</div>


<!-- الصور -->

<div class="card">

<h2>🖼️ صور المنتج</h2>

<p>
تقدر تضيف أكتر من صورة للمنتج.
</p>


<input
id="imageFiles"
type="file"
accept="image/*"
multiple
>


<button
class="primary"
onclick="uploadImages()"
>
⬆️ إضافة الصور
</button>


<div id="images"></div>

<div id="imageMsg"></div>

</div>


<!-- الفيديو -->

<div class="card">

<h2>🎬 فيديو المنتج</h2>

<input
id="videoFile"
type="file"
accept="video/*"
>


<button
class="primary"
onclick="uploadVideo()"
>
⬆️ إضافة / تغيير الفيديو
</button>


<div id="video"></div>

<div id="videoMsg"></div>

</div>


<!-- حذف المنتج -->

<div class="card">

<h2>⚠️ منطقة خطرة</h2>

<p>
حذف المنتج نهائيًا من قاعدة البيانات.
</p>

<button
class="red"
onclick="deleteProduct()"
>
🗑️ حذف المنتج نهائيًا
</button>

</div>


</div>


<div
id="pageMsg"
class="card hidden"
></div>


</div>


<script>


/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://tzjtivfzawffqgisrowv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==============================
   PRODUCT ID
============================== */

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");


/* ==============================
   STORAGE
============================== */

const IMAGE_BUCKET =
"product-images";

const VIDEO_BUCKET =
"product-videos";


/* ==============================
   ELEMENTS
============================== */

const loading =
document.getElementById("loading");

const editor =
document.getElementById("editor");


/* ==============================
   ESCAPE
============================== */

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==============================
   BACK
============================== */

function goBack(){

window.location.href =
"admin.html";

}


/* ==============================
   LOAD PRODUCT
============================== */

async function loadProduct(){

if(!productId){

loading.innerHTML =
'<div class="msg error">❌ رقم المنتج غير موجود.</div>';

return;

}


const {data,error} =
await client
.from("products")
.select("*")
.eq("id",productId)
.single();


if(error || !data){

loading.innerHTML =
'<div class="msg error">❌ لم يتم العثور على المنتج.</div>';

console.error(error);

return;

}


/* البيانات */

document.getElementById("name").value =
data.name || "";

document.getElementById("description").value =
data.description || "";

document.getElementById("price").value =
data.price ?? "";

document.getElementById("old_price").value =
data.old_price ?? "";

document.getElementById("stock").value =
data.stock ?? 0;

document.getElementById("category").value =
data.category || "";

document.getElementById("is_active").value =
String(
data.is_active
);

document.getElementById("is_featured").value =
String(
data.is_featured
);


/* عرض الصفحة */

loading.classList.add("hidden");

editor.classList.remove("hidden");


await loadImages();

await loadVideo();

}


/* ==============================
   SAVE PRODUCT
============================== */

async function saveProduct(){

const msg =
document.getElementById("saveMsg");

msg.innerHTML =
"⏳ جاري الحفظ...";


const name =
document.getElementById("name").value.trim();

const description =
document.getElementById("description").value.trim();

const price =
Number(
document.getElementById("price").value
);

const oldPriceValue =
document.getElementById("old_price").value;

const old_price =
oldPriceValue === ""
?
null
:
Number(oldPriceValue);

const stock =
Number(
document.getElementById("stock").value
);

const category =
document.getElementById("category").value;

const is_active =
document.getElementById("is_active").value === "true";

const is_featured =
document.getElementById("is_featured").value === "true";


if(!name){

msg.innerHTML =
'<div class="msg error">❌ اكتب اسم المنتج.</div>';

return;

}

if(!Number.isFinite(price)){

msg.innerHTML =
'<div class="msg error">❌ اكتب سعر صحيح.</div>';

return;

}


const {error} =
await client
.from("products")
.update({

name:name,

description:description,

price:price,

old_price:old_price,

stock:stock,

category:category,

is_active:is_active,

is_featured:is_featured

})
.eq(
"id",
productId
);


if(error){

msg.innerHTML =
'<div class="msg error">❌ فشل الحفظ:<br>'+
escapeHtml(error.message)+
'</div>';

return;

}


msg.innerHTML =
'<div class="msg success">✅ تم حفظ تعديلات المنتج.</div>';

}


/* ==============================
   LOAD IMAGES
============================== */

async function loadImages(){

const box =
document.getElementById("images");

box.innerHTML =
"⏳ جاري تحميل الصور...";


const {data,error} =
await client
.from("product_images")
.select("*")
.eq(
"product_id",
productId
)
.order(
"is_main",
{ascending:false}
)
.order(
"id",
{ascending:true}
);


if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}


if(!data || !data.length){

box.innerHTML =
"<p>لا توجد صور إضافية لهذا المنتج.</p>";

return;

}


box.innerHTML =

`
<div class="images-grid">

${
data.map(img=>`

<div class="image-card">

<img
src="${escapeHtml(img.image_url)}"
alt="صورة المنتج"
>


${
img.is_main
?
`
<div class="main-label">
⭐ الصورة الرئيسية
</div>
`
:
`
<button
class="green"
onclick="setMainImage(${img.id})"
>
⭐ جعلها الرئيسية
</button>
`
}


<button
class="red"
onclick="deleteImage(
${img.id},
'${escapeHtml(img.image_url)}'
)"
>
🗑️ حذف الصورة
</button>

</div>

`).join("")
}

</div>
`;

}


/* ==============================
   UPLOAD IMAGES
============================== */

async function uploadImages(){

const msg =
document.getElementById("imageMsg");

const input =
document.getElementById("imageFiles");

const files =
Array.from(input.files || []);


if(!files.length){

msg.innerHTML =
'<div class="msg error">❌ اختار صورة واحدة على الأقل.</div>';

return;

}


msg.innerHTML =
"⏳ جاري رفع الصور...";


let uploaded = 0;


for(const file of files){

const safeName =
file.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const path =
productId+
"/"+
Date.now()+
"_"+
Math.random()
.toString(36)
.slice(2)+
"_"+
safeName;


const {error:uploadError} =
await client.storage
.from(IMAGE_BUCKET)
.upload(
path,
file,
{
upsert:false
}
);


if(uploadError){

console.error(uploadError);

continue;

}


const {data:urlData} =
client.storage
.from(IMAGE_BUCKET)
.getPublicUrl(path);


const imageUrl =
urlData.publicUrl;


/* أول صورة تصبح رئيسية إذا لم توجد صورة رئيسية */

const {data:existingMain} =
await client
.from("product_images")
.select("id")
.eq(
"product_id",
productId
)
.eq(
"is_main",
true
)
.limit(1);


const isMain =
!existingMain ||
!existingMain.length;


const {error:insertError} =
await client
.from("product_images")
.insert({

product_id:Number(productId),

image_url:imageUrl,

is_main:isMain

});


if(insertError){

console.error(insertError);

continue;

}


uploaded++;

}


/* تحديث */

input.value="";

await loadImages();

await syncMainImage();


msg.innerHTML =
'<div class="msg success">✅ تم رفع '+
uploaded+
' صورة.</div>';

}


/* ==============================
   SET MAIN IMAGE
============================== */

async function setMainImage(imageId){

const {error:resetError} =
await client
.from("product_images")
.update({
is_main:false
})
.eq(
"product_id",
productId
);


if(resetError){

alert(
"❌ فشل تحديد الصورة الرئيسية:\n"+
resetError.message
);

return;

}


const {data,error} =
await client
.from("product_images")
.update({
is_main:true
})
.eq(
"id",
imageId
)
.select()
.single();


if(error){

alert(
"❌ فشل تحديد الصورة:\n"+
error.message
);

return;

}


if(data){

await syncMainImage();

await loadImages();

alert(
"✅ تم تغيير الصورة الرئيسية"
);

}

}


/* ==============================
   SYNC MAIN IMAGE
============================== */

async function syncMainImage(){

const {data,error} =
await client
.from("product_images")
.select("image_url")
.eq(
"product_id",
productId
)
.eq(
"is_main",
true
)
.limit(1);


if(error){

console.error(error);

return;

}


const mainUrl =
data && data.length
?
data[0].image_url
:
null;


await client
.from("products")
.update({
image_url:mainUrl
})
.eq(
"id",
productId
);

}


/* ==============================
   DELETE IMAGE
============================== */

async function deleteImage(
imageId,
imageUrl
){

const ok =
confirm(
"⚠️ هل تريد حذف هذه الصورة؟"
);

if(!ok)
return;


/* حذف من قاعدة البيانات */

const {error} =
await client
.from("product_images")
.delete()
.eq(
"id",
imageId
);


if(error){

alert(
"❌ فشل حذف الصورة:\n"+
error.message
);

return;

}


/* إذا كانت الصورة الرئيسية */

await syncMainImage();

await loadImages();

alert(
"✅ تم حذف الصورة"
);

}


/* ==============================
   LOAD VIDEO
============================== */

async function loadVideo(){

const box =
document.getElementById("video");

box.innerHTML =
"⏳ جاري تحميل الفيديو...";


const {data,error} =
await client
.from("products")
.select("video_url")
.eq(
"id",
productId
)
.single();


if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}


if(!data.video_url){

box.innerHTML =
"<p>🎬 لا يوجد فيديو لهذا المنتج.</p>";

return;

}


box.innerHTML =

`
<div class="video-box">

<p>
🎬 الفيديو الحالي
</p>

<video
controls
src="${escapeHtml(data.video_url)}"
>
</video>

<br>

<button
class="red"
onclick="deleteVideo()"
>
🗑️ حذف الفيديو
</button>

</div>
`;

}


/* ==============================
   UPLOAD VIDEO
============================== */

async function uploadVideo(){

const input =
document.getElementById("videoFile");

const msg =
document.getElementById("videoMsg");

const file =
input.files[0];


if(!file){

msg.innerHTML =
'<div class="msg error">❌ اختار فيديو أولًا.</div>';

return;

}


msg.innerHTML =
"⏳ جاري رفع الفيديو...";


/* اسم الملف */

const safeName =
file.name
.replace(/[^a-zA-Z0-9._-]/g,"_");


const path =
productId+
"/"+
Date.now()+
"_"+
Math.random()
.toString(36)
.slice(2)+
"_"+
safeName;


/* رفع */

const {error:uploadError} =
await client.storage
.from(VIDEO_BUCKET)
.upload(
path,
file,
{
upsert:false
}
);


if(uploadError){

msg.innerHTML =
'<div class="msg error">❌ فشل رفع الفيديو:<br>'+
escapeHtml(uploadError.message)+
'</div>';

return;

}


/* الرابط */

const {data:urlData} =
client.storage
.from(VIDEO_BUCKET)
.getPublicUrl(path);


const videoUrl =
urlData.publicUrl;


/* حفظ الرابط */

const {error:updateError} =
await client
.from("products")
.update({
video_url:videoUrl
})
.eq(
"id",
productId
);


if(updateError){

msg.innerHTML =
'<div class="msg error">❌ فشل حفظ الفيديو:<br>'+
escapeHtml(updateError.message)+
'</div>';

return;

}


input.value="";

await loadVideo();


msg.innerHTML =
'<div class="msg success">✅ تم إضافة الفيديو بنجاح.</div>';

}


/* ==============================
   DELETE VIDEO
============================== */

async function deleteVideo(){

const ok =
confirm(
"⚠️ هل تريد حذف فيديو المنتج؟"
);

if(!ok)
return;


const {error} =
await client
.from("products")
.update({
video_url:null
})
.eq(
"id",
productId
);


if(error){

alert(
"❌ فشل حذف الفيديو:\n"+
error.message
);

return;

}


await loadVideo();

alert(
"✅ تم حذف الفيديو"
);

}


/* ==============================
   DELETE PRODUCT
============================== */

async function deleteProduct(){

const ok =
confirm(
"⚠️ تحذير!\n\nهل أنت متأكد من حذف المنتج نهائيًا؟"
);

if(!ok)
return;


const {error} =
await client
.from("products")
.delete()
.eq(
"id",
productId
);


if(error){

alert(
"❌ فشل حذف المنتج:\n"+
error.message
);

return;

}


alert(
"✅ تم حذف المنتج بنجاح"
);

window.location.href =
"admin.html";

}


/* ==============================
   START
============================== */

loadProduct();

</script>

</body>

  </html>
