<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة تحكم مكتبة ماما زوزو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff4fb;
  color:#39263d;
}

header{
  background:linear-gradient(135deg,#ff69b4,#9b6cff);
  color:white;
  padding:25px;
  text-align:center;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 5px 20px #0001;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.primary{
  background:#ff69b4;
  color:white;
}

.blue{
  background:#6c63ff;
  color:white;
}

.green{
  background:#20a464;
  color:white;
}

.red{
  background:#e74c3c;
  color:white;
}

.hidden{
  display:none!important;
}

input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-left:55px;
}

.password-box button{
  position:absolute;
  left:8px;
  top:50%;
  transform:translateY(-50%);
  margin:0;
  padding:6px 10px;
  background:transparent;
  font-size:20px;
}

/* PRODUCTS */

.products-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:18px;
}

.product-card{
  background:#fff;
  border:1px solid #eadfea;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 15px #00000012;
  transition:.2s;
  min-width:0;
}

.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 22px #00000018;
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
  background:#f7efff;
}

.no-image{
  width:100%;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f7efff;
  font-size:55px;
}

.product-body{
  padding:14px;
}

.product-name{
  font-size:18px;
  margin:0 0 10px;
  line-height:1.4;
}

.product-detail{
  margin:7px 0;
  font-size:14px;
}

.product-price{
  font-size:19px;
  font-weight:bold;
  color:#9b3f9b;
}

.product-stock{
  color:#20a464;
  font-weight:bold;
}

.product-category{
  color:#666;
}

.product-actions{
  display:flex;
  gap:5px;
  margin-top:12px;
}

.product-actions button{
  flex:1;
  margin:0;
  padding:9px 5px;
  font-size:13px;
}

/* MESSAGES */

.msg{
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.error{
  background:#ffe0e0;
  color:#a00000;
}

.success{
  background:#dcffe9;
  color:#087a35;
}

/* MENU */

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.menu button{
  min-height:100px;
  font-size:18px;
}

.stat{
  text-align:center;
  padding:20px;
  background:#faf5ff;
  border-radius:15px;
}

.stat b{
  display:block;
  font-size:30px;
  color:#9b6cff;
}

/* LIST */

.list-item{
  background:#fff;
  border:1px solid #eee;
  border-radius:15px;
  padding:15px;
  margin:10px 0;
}

.list-item h3{
  margin-top:0;
}

select{
  padding:10px;
  border-radius:9px;
  border:1px solid #ddd;
  background:white;
}

/* MOBILE */

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .products-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-image,
  .no-image{
    height:135px;
  }

  .product-body{
    padding:10px;
  }

  .product-name{
    font-size:15px;
  }

  .product-detail{
    font-size:12px;
  }

  .product-price{
    font-size:16px;
  }

  .product-actions{
    display:block;
  }

  .product-actions button{
    width:100%;
    margin:3px 0;
  }

}

/* TABLET */

@media(min-width:601px) and (max-width:1000px){

  .products-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
  }

  .product-image,
  .no-image{
    height:170px;
  }

}

/* LARGE */

@media(min-width:1001px){

  .products-grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }

}

</style>

</head>

<body>

<header>

<h1>🎀 مكتبة ماما زوزو</h1>

<p>لوحة تحكم الإدارة</p>

</header>

<div class="container">

<!-- LOGIN -->

<div id="loginBox" class="card">

<h2>🔐 تسجيل الدخول</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
>

<div class="password-box">

<input
id="password"
type="password"
placeholder="كلمة المرور"
>

<button
type="button"
id="togglePassword"
onclick="togglePassword()"
>
👁️
</button>

</div>

<button
class="primary"
onclick="login()"
>
دخول
</button>

<div id="loginMsg"></div>

</div>


<!-- ADMIN -->

<div id="adminBox" class="hidden">

<!-- TOP -->

<div class="card">

<div class="row">

<div>

<h2>👑 مرحبًا بك في لوحة الإدارة</h2>

<p>
اختار القسم اللي عايز تديره
</p>

</div>

<div>

<button
class="red"
onclick="logout()"
>
🚪 تسجيل الخروج
</button>

</div>

</div>

</div>


<!-- MENU -->

<div class="card">

<h2>🎛️ أقسام الإدارة</h2>

<div class="menu">

<!-- PRODUCTS -->

<button
class="blue"
onclick="showSection('productsSection')"
>
📦
<br>
المنتجات
</button>


<!-- ORDERS -->

<button
class="green"
onclick="openOrders()"
>
🛒
<br>
الطلبات
</button>


<!-- COMPLAINTS -->

<button
class="primary"
onclick="showSection('complaintsSection')"
>
💬
<br>
الشكاوى والاقتراحات
</button>


<!-- COUPONS -->

<button
class="blue"
onclick="alert('قسم الكوبونات هنضيفه في الخطوة القادمة')"
>
🎟️
<br>
الكوبونات
</button>


<!-- STAFF -->

<button
class="green"
onclick="alert('قسم المشرفين والصلاحيات هنضيفه في الخطوة القادمة')"
>
👥
<br>
المشرفين والصلاحيات
</button>


<!-- SETTINGS -->

<button
class="primary"
onclick="alert('الإعدادات هنضيفها في الخطوة القادمة')"
>
⚙️
<br>
الإعدادات
</button>

</div>

</div>


<!-- PRODUCTS SECTION -->

<div
id="productsSection"
class="card"
>

<div class="row">

<div>

<h2>📦 المنتجات</h2>

<p>
المنتجات الموجودة في المتجر
</p>

</div>

<div>

<button
class="blue"
onclick="loadProducts()"
>
🔄 تحديث
</button>

</div>

</div>

<div id="products"></div>

</div>


<!-- COMPLAINTS SECTION -->

<div
id="complaintsSection"
class="card hidden"
>

<div class="row">

<h2>💬 الشكاوى والاقتراحات</h2>

<button
class="blue"
onclick="loadComplaints()"
>
🔄 تحديث
</button>

</div>

<div id="complaints"></div>

</div>

</div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://tzjtivfzawffqgisrowv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* PASSWORD */

function togglePassword(){

const password =
document.getElementById("password");

const button =
document.getElementById("togglePassword");

if(password.type === "password"){

password.type = "text";

button.textContent = "🙈";

}else{

password.type = "password";

button.textContent = "👁️";

}

}


/* LOGIN */

async function login(){

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;

const msg =
document.getElementById("loginMsg");

if(!email || !password){

msg.innerHTML =
'<div class="msg error">❌ اكتب البريد وكلمة المرور.</div>';

return;

}

msg.innerHTML =
"⏳ جاري تسجيل الدخول...";

try{

const {error} =
await client.auth.signInWithPassword({

email:email,
password:password

});

if(error)
throw error;

msg.innerHTML = "";

await showAdmin();

}catch(error){

msg.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

}

}


/* SHOW ADMIN */

async function showAdmin(){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("adminBox")
.classList.remove("hidden");

await loadProducts();

}


/* LOGOUT */

async function logout(){

await client.auth.signOut();

location.reload();

}


/* OPEN ORDERS */

function openOrders(){

window.location.href =
"orders.html";

}


/* SECTIONS */

function showSection(id){

const sections = [

"productsSection",
"complaintsSection"

];

sections.forEach(section=>{

document
.getElementById(section)
.classList.add("hidden");

});

document
.getElementById(id)
.classList.remove("hidden");


if(id === "productsSection"){

loadProducts();

}

if(id === "complaintsSection"){

loadComplaints();

}

}


/* LOAD PRODUCTS */

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML =
"⏳ جاري تحميل المنتجات...";


const {data,error} =
await client
.from("products")
.select("*")
.order(
"id",
{ascending:false}
);


if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}


if(!data || !data.length){

box.innerHTML =
"<p>لا توجد منتجات حتى الآن.</p>";

return;

}


box.innerHTML =

`
<div class="products-grid">

${
data.map(p => `

<div class="product-card">

${
p.image_url

?

`
<img
class="product-image"
src="${escapeAttr(p.image_url)}"
alt="${escapeAttr(p.name)}"
>
`

:

`
<div class="no-image">
📦
</div>
`

}


<div class="product-body">

<h3 class="product-name">
${escapeHtml(p.name)}
</h3>


<div class="product-detail product-price">

💰 ${p.price} جنيه

</div>


${
p.old_price

?

`
<div class="product-detail">

السعر القديم:

<s>
${p.old_price} جنيه
</s>

</div>
`

:

""

}


<div class="product-detail product-stock">

📦 المخزون:
${p.stock}

</div>


<div class="product-detail product-category">

🏷️ القسم:

${escapeHtml(
p.category || "غير محدد"
)}

</div>


<div class="product-detail">

${
p.is_active

?

"🟢 المنتج نشط"

:

"🔴 المنتج غير نشط"

}

</div>


<div class="product-actions">

<button
class="blue"
onclick="editProduct(${Number(p.id)})"
>
✏️ تعديل
</button>


<button
class="red"
onclick="deleteProduct(${Number(p.id)})"
>
🗑️ حذف
</button>

</div>

</div>

</div>

`).join("")
}

</div>
`;

}


/* EDIT PRODUCT */

function editProduct(id){

if(!id){

alert("❌ رقم المنتج غير موجود");

return;

}

const url =
"edit-product.html?id="+
encodeURIComponent(id);

window.location.assign(url);

}


/* DELETE PRODUCT */

async function deleteProduct(id){

const ok =
confirm(
"⚠️ هل أنت متأكد من حذف المنتج؟\n\nسيتم حذف المنتج من قاعدة البيانات."
);

if(!ok)
return;


const {error} =
await client
.from("products")
.delete()
.eq(
"id",
id
);


if(error){

alert(
"❌ فشل الحذف:\n"+
error.message
);

return;

}


alert(
"✅ تم حذف المنتج بنجاح"
);

await loadProducts();

}


/* LOAD COMPLAINTS */

async function loadComplaints(){

const box =
document.getElementById("complaints");

box.innerHTML =
"⏳ جاري تحميل الشكاوى...";


const {data,error} =
await client
.from("complaints")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}


if(!data || !data.length){

box.innerHTML =
"<p>لا توجد شكاوى أو اقتراحات.</p>";

return;

}


box.innerHTML =

data.map(c => `

<div class="list-item">

<h3>

💬
${escapeHtml(
c.name || "عميل"
)}

</h3>


<p>

📞
${escapeHtml(
c.phone || ""
)}

</p>


<p>

📝
${escapeHtml(
c.message || ""
)}

</p>


<p>

الحالة:

<b>

${escapeHtml(
c.status || "new"
)}

</b>

</p>

</div>

`).join("");

}


/* SECURITY */

function escapeHtml(value){

return String(value ?? "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


function escapeAttr(value){

return escapeHtml(value);

}


/* SESSION */

async function checkSession(){

try{

const {data} =
await client.auth.getSession();

if(
data &&
data.session
){

await showAdmin();

}

}catch(error){

console.error(
"Session error:",
error
);

}

}


/* START */

checkSession();

</script>

</body>
</html>
