<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم مكتبة ماما زوزو</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff5fb;color:#35263b}
header{background:linear-gradient(135deg,#ff69b4,#a66cff);color:white;padding:22px;text-align:center}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:white;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:bold;margin:4px}
.primary{background:#ff69b4;color:white}
.blue{background:#6c63ff;color:white}
.green{background:#20a464;color:white}
.red{background:#e74c3c;color:white}
.gray{background:#eee}
.hidden{display:none}
.product{border:1px solid #eee;border-radius:14px;padding:15px;margin:10px 0}
.product img{width:90px;height:90px;object-fit:cover;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
h2{margin-top:5px}
.error{background:#ffe1e1;color:#a00;padding:12px;border-radius:10px;margin:10px 0}
.success{background:#ddffe9;color:#087a35;padding:12px;border-radius:10px;margin:10px 0}
</style>
</head>

<body>

<header>
<h1>🎀 لوحة تحكم مكتبة ماما زوزو</h1>
<p>إدارة المنتجات والطلبات</p>
</header>

<div class="container">

<div id="loginBox" class="card">
<h2>🔐 تسجيل دخول الأدمن</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button class="primary" onclick="login()">دخول</button>
<div id="loginMsg"></div>
</div>

<div id="adminBox" class="hidden">

<div class="card">
<div class="row">
<h2>👑 لوحة الإدارة</h2>
<button class="red" onclick="logout()">تسجيل الخروج</button>
</div>
</div>

<div class="card">
<h2>➕ إضافة منتج</h2>

<input id="pname" placeholder="اسم المنتج">
<textarea id="pdesc" placeholder="وصف المنتج"></textarea>

<div class="row">
<input id="pprice" type="number" placeholder="السعر">
<input id="poldprice" type="number" placeholder="السعر القديم">
</div>

<div class="row">
<input id="pstock" type="number" placeholder="الكمية في المخزون">
<input id="pcategory" placeholder="القسم">
</div>

<input id="pimage" placeholder="رابط صورة المنتج">
<input id="pvideo" placeholder="رابط فيديو المنتج">

<button class="primary" onclick="addProduct()">إضافة المنتج</button>
<div id="productMsg"></div>
</div>

<div class="card">
<h2>📦 المنتجات</h2>
<button class="blue" onclick="loadProducts()">🔄 تحديث</button>
<div id="products"></div>
</div>

<div class="card">
<h2>🛒 الطلبات</h2>
<button class="blue" onclick="loadOrders()">🔄 تحديث الطلبات</button>
<div id="orders"></div>
</div>

<div class="card">
<h2>💬 الشكاوى والاقتراحات</h2>
<button class="blue" onclick="loadComplaints()">🔄 تحديث</button>
<div id="complaints"></div>
</div>

</div>
</div>

<script>
const SUPABASE_URL="https://tzjtivfzawffqgisrowv.supabase.co";

const SUPABASE_KEY="sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";

const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 const msg=document.getElementById("loginMsg");
 msg.innerHTML="";

 const {error}=await client.auth.signInWithPassword({
   email,
   password
 });

 if(error){
   msg.innerHTML='<div class="error">'+error.message+'</div>';
   return;
 }

 showAdmin();
}

async function showAdmin(){
 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("adminBox").classList.remove("hidden");

 await loadProducts();
 await loadOrders();
 await loadComplaints();
}

async function logout(){
 await client.auth.signOut();
 location.reload();
}

async function addProduct(){

 const msg=document.getElementById("productMsg");
 msg.innerHTML="جارٍ الإضافة...";

 const product={
   name:document.getElementById("pname").value.trim(),
   description:document.getElementById("pdesc").value.trim(),
   price:Number(document.getElementById("pprice").value),
   old_price:Number(document.getElementById("poldprice").value)||null,
   stock:Number(document.getElementById("pstock").value)||0,
   category:document.getElementById("pcategory").value.trim(),
   image_url:document.getElementById("pimage").value.trim()||null,
   video_url:document.getElementById("pvideo").value.trim()||null,
   is_active:true
 };

 if(!product.name || !product.price){
   msg.innerHTML='<div class="error">اكتب اسم المنتج والسعر.</div>';
   return;
 }

 const {error}=await client
   .from("products")
   .insert(product);

 if(error){
   msg.innerHTML='<div class="error">'+error.message+'</div>';
   return;
 }

 msg.innerHTML='<div class="success">✅ تمت إضافة المنتج بنجاح</div>';

 document.getElementById("pname").value="";
 document.getElementById("pdesc").value="";
 document.getElementById("pprice").value="";
 document.getElementById("poldprice").value="";
 document.getElementById("pstock").value="";
 document.getElementById("pcategory").value="";
 document.getElementById("pimage").value="";
 document.getElementById("pvideo").value="";

 loadProducts();
}

async function loadProducts(){

 const box=document.getElementById("products");
 box.innerHTML="جارٍ تحميل المنتجات...";

 const {data,error}=await client
   .from("products")
   .select("*")
   .order("id",{ascending:false});

 if(error){
   box.innerHTML='<div class="error">'+error.message+'</div>';
   return;
 }

 if(!data.length){
   box.innerHTML="<p>لا توجد منتجات.</p>";
   return;
 }

 box.innerHTML=data.map(p=>`
 <div class="product">
   <div class="row">
     ${p.image_url?`<img src="${escapeHtml(p.image_url)}">`:""}
     <div>
       <h3>${escapeHtml(p.name)}</h3>
       <p>السعر: <b>${p.price} جنيه</b></p>
       <p>المخزون: <b>${p.stock}</b></p>
       <p>القسم: ${escapeHtml(p.category||"غير محدد")}</p>
     </div>
   </div>

   <hr>

   <div class="row">
     <input id="price-${p.id}" type="number" value="${p.price}" placeholder="السعر">
     <input id="stock-${p.id}" type="number" value="${p.stock}" placeholder="المخزون">
   </div>

   <input id="name-${p.id}" value="${escapeAttr(p.name)}" placeholder="اسم المنتج">

   <button class="green" onclick="updateProduct(${p.id})">
     💾 حفظ التعديل
   </button>

   <button class="red" onclick="deleteProduct(${p.id})">
     🗑️ حذف
   </button>
 </div>
 `).join("");
}

async function updateProduct(id){

 const name=document.getElementById("name-"+id).value.trim();
 const price=Number(document.getElementById("price-"+id).value);
 const stock=Number(document.getElementById("stock-"+id).value);

 if(!name || !price){
   alert("اكتب اسم المنتج والسعر");
   return;
 }

 const {error}=await client
   .from("products")
   .update({
     name,
     price,
     stock
   })
   .eq("id",id);

 if(error){
   alert("فشل التعديل: "+error.message);
   return;
 }

 alert("✅ تم تعديل المنتج");
 loadProducts();
}

async function deleteProduct(id){

 if(!confirm("متأكد إنك عايز تحذف المنتج؟")) return;

 const {error}=await client
   .from("products")
   .delete()
   .eq("id",id);

 if(error){
   alert("فشل الحذف: "+error.message);
   return;
 }

 alert("✅ تم حذف المنتج");
 loadProducts();
}

async function loadOrders(){

 const box=document.getElementById("orders");
 box.innerHTML="جارٍ تحميل الطلبات...";

 const {data,error}=await client
   .from("orders")
   .select("*")
   .order("created_at",{ascending:false});

 if(error){
   box.innerHTML='<div class="error">'+error.message+'</div>';
   return;
 }

 if(!data.length){
   box.innerHTML="<p>لا توجد طلبات.</p>";
   return;
 }

 box.innerHTML=data.map(o=>`
 <div class="product">
   <h3>طلب #${o.id}</h3>
   <p>العميل: ${escapeHtml(o.customer_name)}</p>
   <p>الهاتف: ${escapeHtml(o.phone)}</p>
   <p>العنوان: ${escapeHtml(o.address||"")}</p>
   <p>الإجمالي: <b>${o.total} جنيه</b></p>

   <select onchange="updateOrderStatus(${o.id},this.value)">
     ${["pending","confirmed","processing","shipped","delivered","cancelled"]
       .map(s=>`<option value="${s}" ${o.status===s?"selected":""}>${s}</option>`).join("")}
   </select>
 </div>
 `).join("");
}

async function updateOrderStatus(id,status){

 const {error}=await client
   .from("orders")
   .update({status})
   .eq("id",id);

 if(error){
   alert("فشل تحديث الطلب: "+error.message);
   return;
 }

 alert("✅ تم تحديث حالة الطلب");
}

async function loadComplaints(){

 const box=document.getElementById("complaints");
 box.innerHTML="جارٍ تحميل الشكاوى...";

 const {data,error}=await client
   .from("complaints")
   .select("*")
   .order("created_at",{ascending:false});

 if(error){
   box.innerHTML='<div class="error">'+error.message+'</div>';
   return;
 }

 if(!data.length){
   box.innerHTML="<p>لا توجد شكاوى أو اقتراحات.</p>";
   return;
 }

 box.innerHTML=data.map(c=>`
 <div class="product">
   <h3>${escapeHtml(c.name||"عميل")}</h3>
   <p>الهاتف: ${escapeHtml(c.phone||"")}</p>
   <p>${escapeHtml(c.message)}</p>
   <p>الحالة: <b>${escapeHtml(c.status||"new")}</b></p>
 </div>
 `).join("");
}

function escapeHtml(value){
 return String(value??"")
   .replaceAll("&","&amp;")
   .replaceAll("<","&lt;")
   .replaceAll(">","&gt;")
   .replaceAll('"',"&quot;")
   .replaceAll("'","&#039;");
}

function escapeAttr(value){
 return escapeHtml(value);
}

async function checkSession(){
 const {data}=await client.auth.getSession();

 if(data.session){
   showAdmin();
 }
}

checkSession();
</script>

</body>
</html>
