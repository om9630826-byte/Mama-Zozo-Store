<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم - مكتبة ماما زوزو</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin: 18px 0;
      box-shadow: 0 5px 20px #0001;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      margin: 5px 0;
      cursor: pointer;
      background: #7c3aed;
      color: white;
      font-size: 15px;
    }

    button:hover {
      opacity: .9;
    }

    .danger {
      background: #dc2626;
    }

    .success {
      background: #16a34a;
    }

    .dark {
      background: #111827;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(200px, 1fr)
      );
      gap: 15px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 15px #0001;
    }

    .stat h2 {
      margin: 8px 0 0;
      color: #7c3aed;
    }

    .product,
    .order,
    .complaint {
      border: 1px solid #eee;
      background: #fafafa;
      border-radius: 15px;
      padding: 17px;
      margin: 12px 0;
    }

    .product img {
      width: 150px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    .msg {
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      background: #fef3c7;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media(max-width:600px) {
      .container {
        padding: 10px;
      }

      .panel {
        padding: 15px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ مكتبة ماما زوزو</h1>
  <p>لوحة تحكم الإدارة</p>
</header>

<div class="container">

  <!-- تسجيل الدخول -->
  <div id="loginBox" class="panel">

    <h2>🔐 تسجيل دخول الإدارة</h2>

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني">

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور">

    <button onclick="login()">
      دخول
    </button>

    <div id="loginMsg"></div>

  </div>


  <!-- لوحة التحكم -->
  <div id="dashboard" class="hidden">

    <div class="panel">

      <h2>👋 أهلاً بيك</h2>

      <p>
        أنت داخل لوحة تحكم مكتبة ماما زوزو.
      </p>

      <button
        class="dark"
        onclick="logout()">
        تسجيل الخروج
      </button>

    </div>


    <!-- الإحصائيات -->
    <div class="grid">

      <div class="stat">
        <div>📦 المنتجات</div>
        <h2 id="productsCount">0</h2>
      </div>

      <div class="stat">
        <div>🛒 الطلبات</div>
        <h2 id="ordersCount">0</h2>
      </div>

      <div class="stat">
        <div>💬 الشكاوى</div>
        <h2 id="complaintsCount">0</h2>
      </div>

    </div>


    <!-- إضافة منتج -->
    <div class="panel">

      <h2>➕ إضافة منتج</h2>

      <input
        id="productName"
        placeholder="اسم المنتج">

      <input
        id="productPrice"
        type="number"
        step="0.01"
        placeholder="السعر">

      <input
        id="oldPrice"
        type="number"
        step="0.01"
        placeholder="السعر القديم - اختياري">

      <input
        id="productStock"
        type="number"
        min="0"
        placeholder="الكمية في المخزون">

      <input
        id="productCategory"
        placeholder="القسم">

      <textarea
        id="productDescription"
        placeholder="وصف المنتج"></textarea>

      <input
        id="productImage"
        placeholder="رابط صورة المنتج">

      <input
        id="productVideo"
        placeholder="رابط فيديو المنتج - اختياري">

      <button
        class="success"
        onclick="addProduct()">
        ➕ إضافة المنتج
      </button>

      <div id="productMsg"></div>

    </div>


    <!-- المنتجات -->
    <div class="panel">

      <h2>📦 المنتجات</h2>

      <button onclick="loadProducts()">
        🔄 تحديث
      </button>

      <div id="productsList"></div>

    </div>


    <!-- الطلبات -->
    <div class="panel">

      <h2>🛒 الطلبات</h2>

      <button onclick="loadOrders()">
        🔄 تحديث الطلبات
      </button>

      <div id="ordersList"></div>

    </div>


    <!-- الشكاوى -->
    <div class="panel">

      <h2>💬 الشكاوى والاقتراحات</h2>

      <button onclick="loadComplaints()">
        🔄 تحديث الشكاوى
      </button>

      <div id="complaintsList"></div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   🔑 SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://tzjtivfzawffqgisrowv.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   أدوات مساعدة
   ===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function message(id, text, type = "") {

  const element =
    document.getElementById(id);

  if (!element) return;

  element.innerHTML =
    `<div class="msg ${type}">
      ${text}
    </div>`;

}


/* =====================================================
   تسجيل الدخول
   ===================================================== */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    message(
      "loginMsg",
      "❌ اكتب البريد الإلكتروني وكلمة المرور",
      "error"
    );

    return;
  }


  message(
    "loginMsg",
    "⏳ جاري تسجيل الدخول..."
  );


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    console.error(error);

    message(
      "loginMsg",
      "❌ فشل تسجيل الدخول: " +
      escapeHtml(error.message),
      "error"
    );

    return;
  }


  document
    .getElementById("loginBox")
    .classList.add("hidden");


  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  await loadAll();

}


/* =====================================================
   تسجيل الخروج
   ===================================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =====================================================
   تحميل البيانات
   ===================================================== */

async function loadAll() {

  await loadProducts();

  await loadOrders();

  await loadComplaints();

}


/* =====================================================
   المنتجات
   ===================================================== */

async function loadProducts() {

  const list =
    document.getElementById(
      "productsList"
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    list.innerHTML =
      `<div class="msg error">
        ❌ فشل تحميل المنتجات:<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  document
    .getElementById("productsCount")
    .innerText = data.length;


  if (!data.length) {

    list.innerHTML =
      `<div class="empty">
        لا توجد منتجات
      </div>`;

    return;
  }


  let html = "";


  data.forEach(product => {

    const image =
      product.image_url
        ? `
          <img
            src="${escapeHtml(
              product.image_url
            )}"
            alt="${escapeHtml(
              product.name
            )}"
            onerror="
              this.style.display='none'
            ">
        `
        : "";


    html += `

      <div class="product">

        ${image}

        <h3>
          ${escapeHtml(
            product.name
          )}
        </h3>

        <p>
          💰 السعر:
          <strong>
            ${product.price} جنيه
          </strong>
        </p>

        ${
          product.old_price
            ? `
              <p>
                🏷️ السعر القديم:
                ${product.old_price} جنيه
              </p>
            `
            : ""
        }

        <p>
          📦 المخزون:
          ${product.stock}
        </p>

        <p>
          🏷️ القسم:
          ${escapeHtml(
            product.category || "-"
          )}
        </p>

        <button
          class="danger"
          onclick="
            deleteProduct(${product.id})
          ">
          🗑️ حذف
        </button>

      </div>

    `;

  });


  list.innerHTML = html;

}


/* =====================================================
   إضافة منتج
   ===================================================== */

async function addProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const oldPriceText =
    document
      .getElementById("oldPrice")
      .value
      .trim();


  const old_price =
    oldPriceText
      ? Number(oldPriceText)
      : null;


  const stockText =
    document
      .getElementById("productStock")
      .value
      .trim();


  const stock =
    stockText
      ? Number(stockText)
      : 0;


  const category =
    document
      .getElementById("productCategory")
      .value
      .trim();


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const image_url =
    document
      .getElementById("productImage")
      .value
      .trim();


  const video_url =
    document
      .getElementById("productVideo")
      .value
      .trim();


  if (!name) {

    message(
      "productMsg",
      "❌ اكتب اسم المنتج",
      "error"
    );

    return;
  }


  if (!price || price <= 0) {

    message(
      "productMsg",
      "❌ اكتب سعر صحيح",
      "error"
    );

    return;
  }


  if (stock < 0) {

    message(
      "productMsg",
      "❌ المخزون غير صحيح",
      "error"
    );

    return;
  }


  message(
    "productMsg",
    "⏳ جاري إضافة المنتج..."
  );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .insert({

        name: name,

        price: price,

        old_price: old_price,

        stock: stock,

        category:
          category || null,

        description:
          description || null,

        image_url:
          image_url || null,

        video_url:
          video_url || null,

        is_active: true

      })
      .select()
      .single();


  if (error) {

    console.error(
      "ADD PRODUCT ERROR:",
      error
    );


    message(
      "productMsg",
      "❌ لم تتم إضافة المنتج:<br><br>" +
      escapeHtml(
        error.message
      ),
      "error"
    );

    return;
  }


  message(
    "productMsg",
    "✅ تمت إضافة المنتج بنجاح 🎉",
    "ok"
  );


  document
    .getElementById("productName")
    .value = "";

  document
    .getElementById("productPrice")
    .value = "";

  document
    .getElementById("oldPrice")
    .value = "";

  document
    .getElementById("productStock")
    .value = "";

  document
    .getElementById("productCategory")
    .value = "";

  document
    .getElementById("productDescription")
    .value = "";

  document
    .getElementById("productImage")
    .value = "";

  document
    .getElementById("productVideo")
    .value = "";


  await loadProducts();

}


/* =====================================================
   حذف منتج
   ===================================================== */

async function deleteProduct(id) {

  if (
    !confirm(
      "⚠️ هل أنت متأكد من حذف المنتج؟"
    )
  ) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "❌ فشل الحذف:\n\n" +
      error.message
    );

    console.error(error);

    return;
  }


  await loadProducts();

}


/* =====================================================
   الطلبات
   ===================================================== */

async function loadOrders() {

  const list =
    document.getElementById(
      "ordersList"
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    list.innerHTML =
      `<div class="msg error">
        ❌ فشل تحميل الطلبات:<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  document
    .getElementById("ordersCount")
    .innerText = data.length;


  if (!data.length) {

    list.innerHTML =
      `<div class="empty">
        لا توجد طلبات
      </div>`;

    return;
  }


  let html = "";


  data.forEach(order => {

    html += `

      <div class="order">

        <h3>
          🛒 طلب #${order.id}
        </h3>

        <p>
          👤 العميل:
          ${escapeHtml(
            order.customer_name
          )}
        </p>

        <p>
          📞 الهاتف:
          ${escapeHtml(
            order.phone
          )}
        </p>

        <p>
          📍 المحافظة:
          ${escapeHtml(
            order.governorate || "-"
          )}
        </p>

        <p>
          🏠 العنوان:
          ${escapeHtml(
            order.address || "-"
          )}
        </p>

        <p>
          💰 الإجمالي:
          <strong>
            ${order.total} جنيه
          </strong>
        </p>

        <p>
          📌 الحالة:
          ${escapeHtml(
            order.status
          )}
        </p>

        <select
          onchange="
            updateOrderStatus(
              ${order.id},
              this.value
            )
          ">

          <option
            value="pending"
            ${
              order.status === "pending"
                ? "selected"
                : ""
            }>
            قيد المراجعة
          </option>

          <option
            value="confirmed"
            ${
              order.status === "confirmed"
                ? "selected"
                : ""
            }>
            مؤكد
          </option>

          <option
            value="shipped"
            ${
              order.status === "shipped"
                ? "selected"
                : ""
            }>
            تم الشحن
          </option>

          <option
            value="delivered"
            ${
              order.status === "delivered"
                ? "selected"
                : ""
            }>
            تم التسليم
          </option>

          <option
            value="cancelled"
            ${
              order.status === "cancelled"
                ? "selected"
                : ""
            }>
            ملغي
          </option>

        </select>

      </div>

    `;

  });


  list.innerHTML = html;

}


/* =====================================================
   تحديث حالة الطلب
   ===================================================== */

async function updateOrderStatus(
  id,
  status
) {

  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .update({
        status: status
      })
      .eq("id", id);


  if (error) {

    alert(
      "❌ فشل تحديث الطلب:\n\n" +
      error.message
    );

    console.error(error);

    return;
  }


  await loadOrders();

}


/* =====================================================
   الشكاوى
   ===================================================== */

async function loadComplaints() {

  const list =
    document.getElementById(
      "complaintsList"
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("complaints")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    list.innerHTML =
      `<div class="msg error">
        ❌ فشل تحميل الشكاوى:<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  document
    .getElementById("complaintsCount")
    .innerText = data.length;


  if (!data.length) {

    list.innerHTML =
      `<div class="empty">
        لا توجد شكاوى أو اقتراحات
      </div>`;

    return;
  }


  let html = "";


  data.forEach(item => {

    html += `

      <div class="complaint">

        <h3>
          💬 ${escapeHtml(
            item.name || "عميل"
          )}
        </h3>

        <p>
          📞 ${escapeHtml(
            item.phone || "-"
          )}
        </p>

        <p>
          📝 ${escapeHtml(
            item.message
          )}
        </p>

        <p>
          📌 الحالة:
          ${escapeHtml(
            item.status || "new"
          )}
        </p>

        ${
          item.admin_reply
            ? `
              <p>
                👨‍💼 رد الإدارة:
                ${escapeHtml(
                  item.admin_reply
                )}
              </p>
            `
            : ""
        }

      </div>

    `;

  });


  list.innerHTML = html;

}


/* =====================================================
   التحقق من الجلسة
   ===================================================== */

async function checkSession() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (error) {

    console.error(error);

    return;
  }


  if (data.session) {

    document
      .getElementById("loginBox")
      .classList.add("hidden");


    document
      .getElementById("dashboard")
      .classList.remove("hidden");


    await loadAll();

  }

}


/* تشغيل الصفحة */
checkSession();

</script>

</body>
</html>
