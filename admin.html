<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة تحكم مكتبة ماما زوزو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff4fb;
  color:#39263d;
}

header{
  background:linear-gradient(135deg,#ff69b4,#9b6cff);
  color:white;
  padding:25px;
  text-align:center;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 5px 20px #0001;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.primary{
  background:#ff69b4;
  color:white;
}

.blue{
  background:#6c63ff;
  color:white;
}

.green{
  background:#20a464;
  color:white;
}

.red{
  background:#e74c3c;
  color:white;
}

.hidden{
  display:none!important;
}

input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-left:55px;
}

.password-box button{
  position:absolute;
  left:8px;
  top:50%;
  transform:translateY(-50%);
  margin:0;
  padding:6px 10px;
  background:transparent;
  font-size:20px;
}

.product{
  display:flex;
  align-items:center;
  gap:15px;
  border:1px solid #eee;
  border-radius:15px;
  padding:15px;
  margin:10px 0;
  flex-wrap:wrap;
}

.product img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:12px;
}

.product-info{
  flex:1;
}

.msg{
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.error{
  background:#ffe0e0;
  color:#a00000;
}

.success{
  background:#dcffe9;
  color:#087a35;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.menu button{
  min-height:100px;
  font-size:18px;
}

.stat{
  text-align:center;
  padding:20px;
  background:#faf5ff;
  border-radius:15px;
}

.stat b{
  display:block;
  font-size:30px;
  color:#9b6cff;
}

</style>
</head>

<body>

<header>

<h1>🎀 مكتبة ماما زوزو</h1>

<p>
لوحة تحكم الإدارة
</p>

</header>


<div class="container">


<!-- =========================
     LOGIN
========================= -->

<div
id="loginBox"
class="card"
>

<h2>🔐 تسجيل الدخول</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
>

<div class="password-box">

<input
id="password"
type="password"
placeholder="كلمة المرور"
>

<button
type="button"
id="togglePassword"
onclick="togglePassword()"
>
👁️
</button>

</div>

<button
class="primary"
onclick="login()"
>
دخول
</button>

<div id="loginMsg"></div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div
id="adminBox"
class="hidden"
>


<!-- TOP -->

<div class="card">

<div class="row">

<div>
<h2>👑 مرحبًا بك في لوحة الإدارة</h2>
<p>
اختار القسم اللي عايز تديره
</p>
</div>

<div>

<button
class="red"
onclick="logout()"
>
🚪 تسجيل الخروج
</button>

</div>

</div>

</div>


<!-- =========================
     MENU
========================= -->

<div class="card">

<h2>🎛️ أقسام الإدارة</h2>

<div class="menu">

<button
class="blue"
onclick="showSection('productsSection')"
>
📦
<br>
المنتجات
</button>

<button
class="green"
onclick="showSection('ordersSection')"
>
🛒
<br>
الطلبات
</button>

<button
class="primary"
onclick="showSection('complaintsSection')"
>
💬
<br>
الشكاوى والاقتراحات
</button>

<button
class="blue"
onclick="alert('قسم الكوبونات هنضيفه في الخطوة القادمة')"
>
🎟️
<br>
الكوبونات
</button>

<button
class="green"
onclick="alert('قسم المشرفين والصلاحيات هنضيفه في الخطوة القادمة')"
>
👥
<br>
المشرفين والصلاحيات
</button>

<button
class="primary"
onclick="alert('الإعدادات هنضيفها في الخطوة القادمة')"
>
⚙️
<br>
الإعدادات
</button>

</div>

</div>


<!-- =========================
     PRODUCTS
========================= -->

<div
id="productsSection"
class="card"
>

<div class="row">

<h2>📦 المنتجات</h2>

<button
class="blue"
onclick="loadProducts()"
>
🔄 تحديث
</button>

</div>

<div id="products"></div>

</div>


<!-- =========================
     ORDERS
========================= -->

<div
id="ordersSection"
class="card hidden"
>

<div class="row">

<h2>🛒 الطلبات</h2>

<button
class="blue"
onclick="loadOrders()"
>
🔄 تحديث
</button>

</div>

<div id="orders"></div>

</div>


<!-- =========================
     COMPLAINTS
========================= -->

<div
id="complaintsSection"
class="card hidden"
>

<div class="row">

<h2>💬 الشكاوى والاقتراحات</h2>

<button
class="blue"
onclick="loadComplaints()"
>
🔄 تحديث
</button>

</div>

<div id="complaints"></div>

</div>


</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://tzjtivfzawffqgisrowv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   PASSWORD
===================================================== */

function togglePassword(){

const password =
document.getElementById("password");

const button =
document.getElementById("togglePassword");

if(password.type === "password"){

password.type = "text";

button.textContent="🙈";

}else{

password.type = "password";

button.textContent="👁️";

}

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;

const msg =
document.getElementById("loginMsg");

if(!email || !password){

msg.innerHTML =
'<div class="msg error">❌ اكتب البريد وكلمة المرور.</div>';

return;

}

msg.innerHTML =
"⏳ جاري تسجيل الدخول...";

try{

const {error} =
await client.auth.signInWithPassword({

email:email,
password:password

});

if(error)
throw error;

msg.innerHTML="";

await showAdmin();

}catch(error){

msg.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

}

}


/* =====================================================
   SHOW ADMIN
===================================================== */

async function showAdmin(){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("adminBox")
.classList.remove("hidden");

await loadProducts();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

await client.auth.signOut();

location.reload();

}


/* =====================================================
   SECTIONS
===================================================== */

function showSection(id){

const sections=[
"productsSection",
"ordersSection",
"complaintsSection"
];

sections.forEach(section=>{

document
.getElementById(section)
.classList.add("hidden");

});

document
.getElementById(id)
.classList.remove("hidden");


if(id==="productsSection"){
loadProducts();
}

if(id==="ordersSection"){
loadOrders();
}

if(id==="complaintsSection"){
loadComplaints();
}

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML =
"⏳ جاري تحميل المنتجات...";


const {data,error} =
await client
.from("products")
.select("*")
.order(
"id",
{ascending:false}
);


if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}


if(!data || !data.length){

box.innerHTML =
"<p>لا توجد منتجات حتى الآن.</p>";

return;

}


box.innerHTML =
data.map(p=>`

<div class="product">

${
p.image_url
?
`
<img
src="${escapeAttr(p.image_url)}"
>
`
:
`
<div
style="
width:100px;
height:100px;
border-radius:12px;
background:#f3e8ff;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
"
>
📦
</div>
`
}

<div class="product-info">

<h3>
${escapeHtml(p.name)}
</h3>

<p>
💰 السعر:
<b>${p.price} جنيه</b>
</p>

<p>
📦 المخزون:
<b>${p.stock}</b>
</p>

<p>
🏷️ القسم:
${escapeHtml(p.category || "غير محدد")}
</p>

</div>


<button
class="blue"
onclick="editProduct(${p.id})"
>
✏️ تعديل
</button>


<button
class="red"
onclick="deleteProduct(${p.id})"
>
🗑️ حذف
</button>

</div>

`).join("");

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

window.location.href =
"edit-product.html?id="+id;

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

if(
!confirm(
"⚠️ هل أنت متأكد من حذف المنتج؟"
)
)
return;


const {error} =
await client
.from("products")
.delete()
.eq(
"id",
id
);


if(error){

alert(
"❌ فشل الحذف: "+
error.message
);

return;

}


alert(
"✅ تم حذف المنتج"
);

await loadProducts();

}


/* =====================================================
   ORDERS
===================================================== */

async function loadOrders(){

const box =
document.getElementById("orders");

box.innerHTML =
"⏳ جاري تحميل الطلبات...";


const {data,error} =
await client
.from("orders")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}


if(!data || !data.length){

box.innerHTML =
"<p>لا توجد طلبات.</p>";

return;

}


box.innerHTML =
data.map(o=>`

<div class="product">

<div class="product-info">

<h3>
🛒 طلب #${o.id}
</h3>

<p>
👤 العميل:
${escapeHtml(o.customer_name)}
</p>

<p>
📞 الهاتف:
${escapeHtml(o.phone)}
</p>

<p>
📍 العنوان:
${escapeHtml(o.address || "")}
</p>

<p>
💰 الإجمالي:
<b>${o.total} جنيه</b>
</p>

</div>

<select
onchange="
updateOrderStatus(
${o.id},
this.value
)
"
>

${
[
"pending",
"confirmed",
"processing",
"shipped",
"delivered",
"cancelled"
]
.map(s=>`

<option
value="${s}"
${o.status===s?"selected":""}
>
${s}
</option>

`).join("")
}

</select>

</div>

`).join("");

}


/* =====================================================
   UPDATE ORDER
===================================================== */

async function updateOrderStatus(
id,
status
){

const {error} =
await client
.from("orders")
.update({
status:status
})
.eq(
"id",
id
);

if(error){

alert(
"❌ فشل تحديث الطلب: "+
error.message
);

return;

}

alert(
"✅ تم تحديث حالة الطلب"
);

}


/* =====================================================
   COMPLAINTS
===================================================== */

async function loadComplaints(){

const box =
document.getElementById("complaints");

box.innerHTML =
"⏳ جاري تحميل الشكاوى...";


const {data,error} =
await client
.from("complaints")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}


if(!data || !data.length){

box.innerHTML =
"<p>لا توجد شكاوى أو اقتراحات.</p>";

return;

}


box.innerHTML =
data.map(c=>`

<div class="product">

<div class="product-info">

<h3>
💬 ${escapeHtml(c.name || "عميل")}
</h3>

<p>
📞 ${escapeHtml(c.phone || "")}
</p>

<p>
${escapeHtml(c.message || "")}
</p>

<p>
الحالة:
<b>
${escapeHtml(c.status || "new")}
</b>
</p>

</div>

</div>

`).join("");

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function escapeAttr(value){

return escapeHtml(value);

}


/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

try{

const {data} =
await client.auth.getSession();

if(
data &&
data.session
){

await showAdmin();

}

}catch(error){

console.error(
"Session error:",
error
);

}

}


/* START */

checkSession();

</script>

</body>
  </html>
