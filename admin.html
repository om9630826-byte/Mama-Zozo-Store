<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم - مكتبة ماما زوزو</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff4fb;color:#39263d}
header{background:linear-gradient(135deg,#ff69b4,#8b5cf6);color:#fff;padding:22px;text-align:center}
.container{max-width:1100px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
textarea{min-height:90px}
button{border:0;border-radius:10px;padding:11px 16px;margin:4px;font-weight:bold;cursor:pointer}
.primary{background:#ff69b4;color:#fff}
.blue{background:#6c63ff;color:#fff}
.green{background:#20a464;color:#fff}
.red{background:#e74c3c;color:#fff}
.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.msg{padding:12px;border-radius:10px;margin:10px 0}
.error{background:#ffe0e0;color:#a00000}
.success{background:#dcffe9;color:#087a35}
.product{border:1px solid #eee;border-radius:14px;padding:15px;margin:12px 0}
.product-main{display:flex;gap:15px;align-items:center}
.product-main img{width:100px;height:100px;object-fit:cover;border-radius:12px}
.images{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.images img{width:70px;height:70px;object-fit:cover;border-radius:9px}
.badge{display:inline-block;background:#f1e7ff;padding:5px 9px;border-radius:20px;font-size:12px}
</style>
</head>

<body>

<header>
<h1>🎀 لوحة تحكم مكتبة ماما زوزو</h1>
<p>إدارة المنتجات والطلبات والشكاوى</p>
</header>

<div class="container">

<!-- تسجيل الدخول -->
<div id="loginBox" class="card">
<h2>🔐 تسجيل الدخول</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

<button class="primary" onclick="login()">دخول</button>

<div id="loginMsg"></div>
</div>


<!-- لوحة الإدارة -->
<div id="adminBox" class="hidden">

<div class="card">
<div class="row">
<h2>👑 لوحة الإدارة</h2>
<button class="red" onclick="logout()">تسجيل الخروج</button>
</div>
</div>


<!-- إضافة منتج -->
<div class="card">

<h2>➕ إضافة منتج</h2>

<input id="pname" placeholder="اسم المنتج">

<textarea id="pdesc" placeholder="وصف المنتج"></textarea>

<div class="row">
<input id="pprice" type="number" placeholder="السعر">
<input id="poldprice" type="number" placeholder="السعر القديم">
</div>

<div class="row">
<input id="pstock" type="number" placeholder="المخزون">
<input id="pcategory" placeholder="القسم">
</div>

<h3>📸 صور المنتج</h3>

<input
id="pimagefile"
type="file"
accept="image/*"
multiple
>

<div id="imagePreview" class="images"></div>

<h3>🎥 فيديو المنتج</h3>

<input
id="pvideofile"
type="file"
accept="video/*"
>

<button class="primary" onclick="addProduct()">
➕ إضافة المنتج
</button>

<div id="productMsg"></div>

</div>


<!-- المنتجات -->
<div class="card">

<h2>📦 المنتجات</h2>

<button class="blue" onclick="loadProducts()">🔄 تحديث المنتجات</button>

<div id="products"></div>

</div>


<!-- الطلبات -->
<div class="card">

<h2>🛒 الطلبات</h2>

<button class="blue" onclick="loadOrders()">🔄 تحديث الطلبات</button>

<div id="orders"></div>

</div>


<!-- الشكاوى -->
<div class="card">

<h2>💬 الشكاوى والاقتراحات</h2>

<button class="blue" onclick="loadComplaints()">🔄 تحديث</button>

<div id="complaints"></div>

</div>

</div>
</div>


<script>

/* ===============================
   🔑 Supabase
=============================== */

const SUPABASE_URL =
"https://tzjtivfzawffqgisrowv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ===============================
   تسجيل الدخول
=============================== */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("loginMsg");

if(!email || !password){

msg.innerHTML =
'<div class="msg error">اكتب البريد الإلكتروني وكلمة المرور.</div>';

return;
}

msg.innerHTML =
'<div class="msg">⏳ جاري تسجيل الدخول...</div>';

try{

const {error} =
await client.auth.signInWithPassword({
email:email,
password:password
});

if(error) throw error;

await showAdmin();

}catch(error){

msg.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

}

}


/* ===============================
   عرض لوحة الإدارة
=============================== */

async function showAdmin(){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("adminBox")
.classList.remove("hidden");

await loadProducts();
await loadOrders();
await loadComplaints();

}


/* ===============================
   تسجيل الخروج
=============================== */

async function logout(){

await client.auth.signOut();

location.reload();

}


/* ===============================
   معاينة الصور
=============================== */

document
.getElementById("pimagefile")
.addEventListener(
"change",
function(){

const box =
document.getElementById("imagePreview");

box.innerHTML="";

Array.from(this.files).forEach(file=>{

const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);

box.appendChild(img);

});

}
);


/* ===============================
   رفع صورة
=============================== */

async function uploadImage(file){

const ext =
file.name.split(".").pop().toLowerCase();

const path =
"products/" +
Date.now() +
"-" +
Math.random().toString(36).substring(2) +
"." +
ext;

const {error} =
await client.storage
.from("product-images")
.upload(
path,
file,
{
cacheControl:"3600",
upsert:false
}
);

if(error) throw error;

const {data} =
client.storage
.from("product-images")
.getPublicUrl(path);

return data.publicUrl;

}


/* ===============================
   رفع فيديو
=============================== */

async function uploadVideo(file){

if(!file) return null;

const ext =
file.name.split(".").pop().toLowerCase();

const path =
"products/" +
Date.now() +
"-" +
Math.random().toString(36).substring(2) +
"." +
ext;

const {error} =
await client.storage
.from("product-videos")
.upload(
path,
file,
{
cacheControl:"3600",
upsert:false
}
);

if(error) throw error;

const {data} =
client.storage
.from("product-videos")
.getPublicUrl(path);

return data.publicUrl;

}


/* ===============================
   إضافة المنتج
=============================== */

async function addProduct(){

const msg =
document.getElementById("productMsg");

msg.innerHTML =
'<div class="msg">⏳ جاري إضافة المنتج...</div>';

try{

const name =
document.getElementById("pname").value.trim();

const description =
document.getElementById("pdesc").value.trim();

const price =
Number(document.getElementById("pprice").value);

const old_price =
Number(document.getElementById("poldprice").value) || null;

const stock =
Number(document.getElementById("pstock").value) || 0;

const category =
document.getElementById("pcategory").value.trim();

const imageFiles =
Array.from(
document.getElementById("pimagefile").files
);

const videoFile =
document.getElementById("pvideofile").files[0];

if(!name || !price){

msg.innerHTML =
'<div class="msg error">❌ اكتب اسم المنتج والسعر.</div>';

return;
}


/* رفع الصور */

let uploadedImages=[];

for(const file of imageFiles){

const url =
await uploadImage(file);

uploadedImages.push(url);

}


/* رفع الفيديو */

let video_url=null;

if(videoFile){

video_url =
await uploadVideo(videoFile);

}


/* إضافة المنتج */

const {data:product,error} =
await client
.from("products")
.insert({

name:name,
description:description,
price:price,
old_price:old_price,
stock:stock,
category:category,
image_url:
uploadedImages.length
?
uploadedImages[0]
:
null,
video_url:video_url,
is_active:true

})
.select("id")
.single();

if(error) throw error;


/* حفظ الصور كلها */

if(uploadedImages.length){

const rows =
uploadedImages.map(
(url,index)=>({

product_id:product.id,
image_url:url,
is_main:index===0

})
);

const {error:imageError} =
await client
.from("product_images")
.insert(rows);

if(imageError) throw imageError;

}


msg.innerHTML =
'<div class="msg success">✅ تمت إضافة المنتج بنجاح</div>';


/* تنظيف */

document.getElementById("pname").value="";
document.getElementById("pdesc").value="";
document.getElementById("pprice").value="";
document.getElementById("poldprice").value="";
document.getElementById("pstock").value="";
document.getElementById("pcategory").value="";
document.getElementById("pimagefile").value="";
document.getElementById("pvideofile").value="";
document.getElementById("imagePreview").innerHTML="";

await loadProducts();

}catch(error){

msg.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

}

}


/* ===============================
   تحميل المنتجات
=============================== */

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML =
"⏳ جاري تحميل المنتجات...";

const {data,error} =
await client
.from("products")
.select("*")
.order("id",{ascending:false});

if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;
}

if(!data || !data.length){

box.innerHTML="<p>لا توجد منتجات.</p>";

return;
}

box.innerHTML =
data.map(p=>`

<div class="product">

<div class="product-main">

${
p.image_url
?
`<img src="${escapeAttr(p.image_url)}">`
:
""
}

<div>

<h3>${escapeHtml(p.name)}</h3>

<p>
السعر:
<b>${p.price} جنيه</b>
</p>

<p>
المخزون:
<b>${p.stock}</b>
</p>

<p>
القسم:
${escapeHtml(p.category || "غير محدد")}
</p>

${
p.video_url
?
'<span class="badge">🎥 يوجد فيديو</span>'
:
""
}

</div>

</div>

<hr>

<input
id="name-${p.id}"
value="${escapeAttr(p.name)}"
placeholder="اسم المنتج"
>

<div class="row">

<input
id="price-${p.id}"
type="number"
value="${p.price}"
placeholder="السعر"
>

<input
id="stock-${p.id}"
type="number"
value="${p.stock}"
placeholder="المخزون"
>

</div>

<button
class="green"
onclick="updateProduct(${p.id})"
>
💾 حفظ التعديل
</button>

<button
class="red"
onclick="deleteProduct(${p.id})"
>
🗑️ حذف
</button>

</div>

`).join("");

}


/* ===============================
   تعديل المنتج
=============================== */

async function updateProduct(id){

const name =
document.getElementById("name-"+id).value.trim();

const price =
Number(
document.getElementById("price-"+id).value
);

const stock =
Number(
document.getElementById("stock-"+id).value
);

if(!name || !price){

alert("اكتب اسم المنتج والسعر.");

return;

}

const {error} =
await client
.from("products")
.update({

name:name,
price:price,
stock:stock

})
.eq("id",id);

if(error){

alert(
"❌ فشل التعديل: "+
error.message
);

return;

}

alert("✅ تم تعديل المنتج");

await loadProducts();

}


/* ===============================
   حذف المنتج
=============================== */

async function deleteProduct(id){

if(
!confirm(
"هل أنت متأكد من حذف المنتج؟"
)
)
return;

const {error} =
await client
.from("products")
.delete()
.eq("id",id);

if(error){

alert(
"❌ فشل الحذف: "+
error.message
);

return;

}

alert("✅ تم حذف المنتج");

await loadProducts();

}


/* ===============================
   الطلبات
=============================== */

async function loadOrders(){

const box =
document.getElementById("orders");

box.innerHTML =
"⏳ جاري تحميل الطلبات...";

const {data,error} =
await client
.from("orders")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}

if(!data || !data.length){

box.innerHTML =
"<p>لا توجد طلبات.</p>";

return;

}

box.innerHTML =
data.map(o=>`

<div class="product">

<h3>🛒 طلب #${o.id}</h3>

<p>
العميل:
${escapeHtml(o.customer_name)}
</p>

<p>
الهاتف:
${escapeHtml(o.phone)}
</p>

<p>
العنوان:
${escapeHtml(o.address || "")}
</p>

<p>
الإجمالي:
<b>${o.total} جنيه</b>
</p>

<select
onchange="updateOrderStatus(${o.id},this.value)"
>

${
[
"pending",
"confirmed",
"processing",
"shipped",
"delivered",
"cancelled"
]
.map(s=>`

<option
value="${s}"
${o.status===s?"selected":""}
>
${s}
</option>

`).join("")
}

</select>

</div>

`).join("");

}


/* ===============================
   تحديث حالة الطلب
=============================== */

async function updateOrderStatus(id,status){

const {error} =
await client
.from("orders")
.update({
status:status
})
.eq("id",id);

if(error){

alert(
"❌ فشل تحديث الطلب: "+
error.message
);

return;

}

alert("✅ تم تحديث حالة الطلب");

}


/* ===============================
   الشكاوى
=============================== */

async function loadComplaints(){

const box =
document.getElementById("complaints");

box.innerHTML =
"⏳ جاري تحميل الشكاوى...";

const {data,error} =
await client
.from("complaints")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}

if(!data || !data.length){

box.innerHTML =
"<p>لا توجد شكاوى أو اقتراحات.</p>";

return;

}

box.innerHTML =
data.map(c=>`

<div class="product">

<h3>
${escapeHtml(c.name || "عميل")}
</h3>

<p>
الهاتف:
${escapeHtml(c.phone || "")}
</p>

<p>
${escapeHtml(c.message || "")}
</p>

<p>
الحالة:
<b>
${escapeHtml(c.status || "new")}
</b>
</p>

</div>

`).join("");

}


/* ===============================
   حماية النصوص
=============================== */

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function escapeAttr(value){

return escapeHtml(value);

}


/* ===============================
   فحص تسجيل الدخول
=============================== */

async function checkSession(){

const {data} =
await client.auth.getSession();

if(data && data.session){

await showAdmin();

}

}


/* تشغيل الصفحة */

checkSession();

</script>

</body>
</html>
