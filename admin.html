<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إدارة مكتبة ماما زوزو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff4fb;
  color:#39263d;
}

header{
  background:linear-gradient(135deg,#ff69b4,#9b6cff);
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 5px 20px #0001;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.primary{background:#ff69b4;color:white}
.blue{background:#6c63ff;color:white}
.green{background:#20a464;color:white}
.red{background:#e74c3c;color:white}
.gray{background:#eee;color:#333}
.orange{background:#ff9800;color:white}

.hidden{
  display:none!important;
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
}

.product{
  border:1px solid #eee;
  border-radius:14px;
  padding:15px;
  margin:15px 0;

.product-main-image{

  object-fit:cover;
  border-radius:14px;

}

.msg{
  padding:12px;
  border-radius:10px;

}

.error{
  background:#ffe0e0;
  color:#a00000;
}

.success{
  background:#dcffe9;
  color:#087a35;
}

.image-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}

.image-item{
  width:120px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:6px;
  background:#fafafa;
  text-align:center;
}

.image-item img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:9px;
}

.image-item button{
  width:100%;
  margin:3px 0;
  padding:7px;
  font-size:12px;
}

.main-badge{
  display:block;
  background:#fff0a8;
  color:#765d00;
  border-radius:8px;
  padding:5px;
  margin:4px 0;
  font-size:11px;

}

.badge{
  display:inline-block;

  border-radius:20px;

}

.video-box{

}

.video-box video{

}

.password-box{
  position:relative;
}

.password-box input{
  padding-left:55px;
}

.password-box button{
  position:absolute;
  left:8px;
  top:50%;
  transform:translateY(-50%);
  margin:0;
  padding:6px 10px;
  background:transparent;
  font-size:20px;
  color:#39263d;
}

hr{
  border:0;
  border-top:1px solid #eee;
  margin:20px 0;
}
</style>
</head>

<body>

<header>

<div class="container">

<!-- LOGIN -->

<!-- ADMIN -->

<div id="adminBox" class="hidden">

<div class="row">

<button
class="red"
onclick="logout()"
>

</button>

</div>


<!-- ADD PRODUCT -->

<div class="card">

<h2>➕ إضافة منتج</h2>

<input
id="pname"
placeholder="اسم المنتج"
>

<textarea
id="pdesc"

id="pprice"

<h2>🛒 الطلبات</h2>

class="blue"
onclick="loadOrders()"
>
🔄 تحديث الطلبات

<div class="card">

<h2>💬 الشكاوى والاقتراحات</h2>

class="blue"
onclick="loadComplaints()"
>
🔄 تحديث
</button>

<div id="complaints"></div>

</div>

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://tzjtivfzawffqgisrowv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   PASSWORD
===================================================== */

function togglePassword(){

const password =
document.getElementById("password");

const button =
document.getElementById("togglePassword");

if(password.type === "password"){

password.type = "text";

button.textContent = "🙈";

button.setAttribute(
"aria-label",
"إخفاء كلمة المرور"
);

}else{

password.type = "password";

button.textContent = "👁️";

button.setAttribute(
"aria-label",
"إظهار كلمة المرور"
);

}

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const msg =
document.getElementById("loginMsg");

if(!email || !password){

msg.innerHTML =
'<div class="msg error">❌ اكتب البريد الإلكتروني وكلمة المرور.</div>';

return;

}

msg.innerHTML =
"⏳ جاري تسجيل الدخول...";

try{

const {error} =
await client.auth.signInWithPassword({

email:email,
password:password

});

if(error)
throw error;

msg.innerHTML="";

await showAdmin();

}catch(error){

msg.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

}

}


/* =====================================================
   SHOW ADMIN
===================================================== */

async function showAdmin(){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("adminBox")
.classList.remove("hidden");

await loadProducts();
await loadOrders();
await loadComplaints();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

await client.auth.signOut();

location.reload();

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

document
.getElementById("pimagefile")
.addEventListener(
"change",
function(){

const files =
Array.from(this.files);

const box =
document.getElementById(
"imagePreviewList"
);

box.innerHTML="";

files.forEach(file=>{

const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);

box.appendChild(img);

});

}
);


/* =====================================================
   UPLOAD IMAGE
===================================================== */

async function uploadImage(file){

if(!file)
return null;

const ext =
file.name
.split(".")
.pop()
.toLowerCase();

const fileName =
"products/" +
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
ext;

const {error} =
await client.storage
.from("product-images")
.upload(
fileName,
file,
{
cacheControl:"3600",
upsert:false
}
);

if(error)
throw error;

const {data} =
client.storage
.from("product-images")
.getPublicUrl(
fileName
);

return data.publicUrl;

}


/* =====================================================
   UPLOAD VIDEO
===================================================== */

async function uploadVideo(file){

if(!file)
return null;

const ext =
file.name
.split(".")
.pop()
.toLowerCase();

const fileName =
"products/" +
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
ext;

const {error} =
await client.storage
.from("product-videos")
.upload(
fileName,
file,
{
cacheControl:"3600",
upsert:false
}
);

if(error)
throw error;

const {data} =
client.storage
.from("product-videos")
.getPublicUrl(
fileName
);

return data.publicUrl;

}


/* =====================================================
   ADD PRODUCT
===================================================== */

async function addProduct(){

const msg =
document.getElementById(
"productMsg"
);

msg.innerHTML =
'<div class="msg">⏳ جاري إضافة المنتج...</div>';

try{

const name =
document
.getElementById("pname")
.value
.trim();

const description =
document
.getElementById("pdesc")
.value
.trim();

const price =
Number(
document
.getElementById("pprice")
.value
);

const old_price =
Number(
document
.getElementById("poldprice")
.value
) || null;

const stock =
Number(
document
.getElementById("pstock")
.value
) || 0;

const category =
document
.getElementById("pcategory")
.value
.trim();

const imageFiles =
Array.from(
document
.getElementById("pimagefile")
.files
);

const videoFile =
document
.getElementById("pvideofile")
.files[0];

if(!name || !price){

msg.innerHTML =
'<div class="msg error">❌ اكتب اسم المنتج والسعر.</div>';

return;

}


/* رفع الصور */

let uploadedImages=[];

for(const file of imageFiles){

const url =
await uploadImage(file);

uploadedImages.push(url);

}


/* رفع الفيديو */

let video_url=null;

if(videoFile){

video_url =
await uploadVideo(videoFile);

}


/* الصورة الرئيسية */

const image_url =
uploadedImages.length
?
uploadedImages[0]
:
null;


/* إضافة المنتج */

const {data:product,error} =
await client
.from("products")
.insert({

name:name,
description:description,
price:price,
old_price:old_price,
stock:stock,
category:category,
image_url:image_url,
video_url:video_url,
is_active:true

})
.select("id")
.single();

if(error)
throw error;


/* حفظ الصور */

if(uploadedImages.length){

const imageRows =
uploadedImages.map(
(url,index)=>({

product_id:product.id,
image_url:url,
is_main:index===0

})
);

const {error:imagesError} =
await client
.from("product_images")
.insert(imageRows);

if(imagesError)
throw imagesError;

}


/* نجاح */

msg.innerHTML =
'<div class="msg success">✅ تمت إضافة المنتج بنجاح</div>';


/* تنظيف */

document.getElementById("pname").value="";
document.getElementById("pdesc").value="";
document.getElementById("pprice").value="";
document.getElementById("poldprice").value="";
document.getElementById("pstock").value="";
document.getElementById("pcategory").value="";
document.getElementById("pimagefile").value="";
document.getElementById("pvideofile").value="";
document.getElementById("imagePreviewList").innerHTML="";

await loadProducts();

}catch(error){

msg.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

}

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML =
"⏳ جاري تحميل المنتجات...";

const {data,error} =
await client
.from("products")
.select("*")
.order(
"id",
{ascending:false}
);

if(error){

box.innerHTML =
'<div class="msg error">❌ '+
escapeHtml(error.message)+
'</div>';

return;

}

if(!data || !data.length){

box.innerHTML =
"<p>لا توجد منتجات.</p>";

return;

}


/* تحميل صور المنتجات */

const productIds =
data.map(p=>p.id);

const {data:allImages,error:imagesError} =
await client
.from("product_images")
.select("*")
.in(
"product_id",
productIds
)
.order(
"created_at",
{ascending:true}
);

if(imagesError){

box.innerHTML =
'<div class="msg error">❌ خطأ في تحميل الصور: '+
escapeHtml(imagesError.message)+
'</div>';

return;

}

const imageMap={};

(allImages || []).forEach(img=>{

if(!imageMap[img.product_id])
imageMap[img.product_id]=[];

imageMap[img.product_id].push(img);

});


box.innerHTML =
data.map(
p=>{

const images =
imageMap[p.id] || [];

return `

<div class="product">

<div class="row">

<div>

${
p.image_url
?
`
<img
class="product-main-image"
src="${escapeAttr(p.image_url)}"
>
`
:
"<div>📷 لا توجد صورة</div>"
}

</div>

<div>

<h3>
${escapeHtml(p.name)}
</h3>

<p>
السعر:
<b>${p.price} جنيه</b>
</p>

<p>
المخزون:
<b>${p.stock}</b>
</p>

<p>
القسم:
${escapeHtml(p.category || "غير محدد")}
</p>

${
p.video_url
?
'<span class="badge">🎥 يوجد فيديو</span>'
:
'<span class="badge">🚫 لا يوجد فيديو</span>'
}

</div>

</div>


<hr>


<h3>✏️ تعديل بيانات المنتج</h3>

<input
id="name-${p.id}"
value="${escapeAttr(p.name)}"
placeholder="اسم المنتج"
>

<textarea
id="desc-${p.id}"
placeholder="وصف المنتج"
>${escapeHtml(p.description || "")}</textarea>

<div class="row">

<input
id="price-${p.id}"
type="number"
value="${p.price}"
placeholder="السعر"
>

<input
id="stock-${p.id}"
type="number"
value="${p.stock}"
placeholder="المخزون"
>

</div>

<input
id="category-${p.id}"
value="${escapeAttr(p.category || "")}"
placeholder="القسم"
>

<button
class="green"
onclick="updateProduct(${p.id})"
>
💾 حفظ التعديل
</button>


<hr>


<h3>📸 صور المنتج</h3>

<div class="image-list">

${
images.length
?
images.map(img=>`

<div class="image-item">

<img
src="${escapeAttr(img.image_url)}"
>

${
img.is_main
?
'<span class="main-badge">⭐ الصورة الرئيسية</span>'
:
`
<button
class="orange"
onclick="setMainImage(${img.id},${p.id})"
>
⭐ جعلها رئيسية
</button>
`
}

<button
class="red"
onclick="deleteProductImage(${img.id},${p.id})"
>
❌ حذف الصورة
</button>

</div>

`).join("")
:
"<p>لا توجد صور محفوظة.</p>"
}

</div>


<h4>➕ إضافة صور جديدة</h4>

<input
id="new-images-${p.id}"
type="file"
accept="image/*"
multiple
>

<button
class="primary"
onclick="addMoreImages(${p.id})"
>
📸 إضافة الصور
</button>


<hr>


<h3>🎥 فيديو المنتج</h3>

<div class="video-box">

${
p.video_url
?
`
<video
controls
src="${escapeAttr(p.video_url)}"
>
</video>

<br>

<button
class="red"
onclick="deleteProductVideo(${p.id})"
>
❌ حذف الفيديو
</button>

<h4>🔄 استبدال الفيديو</h4>

<input
id="replace-video-${p.id}"
type="file"
accept="video/*"
>

<button
class="orange"
onclick="replaceProductVideo(${p.id})"
>
🔄 استبدال الفيديو
</button>
`
:
`
<p>🚫 لا يوجد فيديو لهذا المنتج.</p>

<input
id="replace-video-${p.id}"
type="file"
accept="video/*"
>

<button
class="primary"
onclick="replaceProductVideo(${p.id})"
>
🎥 إضافة فيديو
</button>
`
}

</div>


<hr>


<button
class="red"
onclick="deleteProduct(${p.id})"
>
🗑️ حذف المنتج بالكامل
</button>

</div>

`;

}
).join("");

}


/* =====================================================
   UPDATE PRODUCT
===================================================== */

async function updateProduct(id){

const name =
document
.getElementById(
"name-"+id
)
.value
.trim();

const description =
document
.getElementById(
"desc-"+id
)
.value
.trim();

const price =
Number(
document
.getElementById(
"price-"+id
)
.value
);

const stock =
Number(
document
.getElementById(
"stock-"+id
)
.value
);

const category =
document
.getElementById(
"category-"+id
)
.value
.trim();

if(!name || !price){

alert(
"اكتب اسم المنتج والسعر"
);

return;

}

const {error} =
await client
.from("products")
.update({

name:name,
description:description,
price:price,
stock:stock,
category:category

})
.eq(
"id",
id
);

if(error){

alert(
"❌ فشل التعديل: "+
error.message
);

return;

}

alert(
"✅ تم تعديل المنتج"
);

await loadProducts();

}


/* =====================================================
   ADD MORE IMAGES
===================================================== */

async function addMoreImages(productId){

const input =
document.getElementById(
"new-images-"+productId
);

const files =
Array.from(input.files);

if(!files.length){

alert(
"اختار صورة واحدة على الأقل."
);

return;

}

try{

let uploaded=[];

for(const file of files){

const url =
await uploadImage(file);

uploaded.push(url);

}

const rows =
uploaded.map(url=>({

product_id:productId,
image_url:url,
is_main:false

}));

const {error} =
await client
.from("product_images")
.insert(rows);

if(error)
throw error;

alert(
"✅ تمت إضافة الصور بنجاح"
);

await loadProducts();

}catch(error){

alert(
"❌ فشل إضافة الصور: "+
error.message
);

}

}


/* =====================================================
   SET MAIN IMAGE
===================================================== */

async function setMainImage(
imageId,
productId
){

try{

/* إلغاء الصورة الرئيسية الحالية */

const {error:resetError} =
await client
.from("product_images")
.update({
is_main:false
})
.eq(
"product_id",
productId
);

if(resetError)
throw resetError;


/* جعل الصورة المختارة رئيسية */

const {data:image,error:imageError} =
await client
.from("product_images")
.update({
is_main:true
})
.eq(
"id",
imageId
)
.select("image_url")
.single();

if(imageError)
throw imageError;


/* تحديث الصورة في products */

const {error:productError} =
await client
.from("products")
.update({
image_url:image.image_url
})
.eq(
"id",
productId
);

if(productError)
throw productError;

alert(
"⭐ تم تغيير الصورة الرئيسية"
);

await loadProducts();

}catch(error){

alert(
"❌ فشل تغيير الصورة الرئيسية: "+
error.message
);

}

}


/* =====================================================
   DELETE PRODUCT IMAGE
===================================================== */

async function deleteProductImage(
imageId,
productId
){

if(
!confirm(
"هل أنت متأكد من حذف هذه الصورة؟"
)
)
return;

try{

/* الحصول على الصورة */

const {data:image,error:findError} =
await client
.from("product_images")
.select("*")
.eq(
"id",
imageId
)
.single();

if(findError)
throw findError;

const wasMain =
image.is_main;


/* حذفها من الجدول */

const {error:deleteError} =
await client
.from("product_images")
.delete()
.eq(

imageId
);

if(deleteError)

/* حذفها من Storage */

)

})

);

.from("products")

})
.eq(
"id",
productId
);

.from("products")
.update({

})
.eq(
"id",
productId
);

}

}

alert(

);

/* =====================================================
   DELETE STORAGE FILE
===================================================== */

async function deleteStorageFile(
bucket,
publicUrl
){

if(!publicUrl)
return;

try{

const marker =
"/storage/v1/object/public/" +
bucket +
"/";

const index =
publicUrl.indexOf(marker);

if(index === -1)
return;

const path =
decodeURIComponent(
publicUrl.substring(
index + marker.length
)
);

const {error} =
await client.storage
.from(bucket)
.remove([path]);

if(error){

console.warn(
"Storage delete warning:",
error.message
);

}

}catch(error){

console.warn(
"Storage delete warning:",
error
);

}

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

if(
!confirm(
"⚠️ هل أنت متأكد من حذف المنتج بالكامل؟"
)
)
return;

try{

/* بيانات المنتج */

const {data:product,error:productError} =
await client
.from("products")
.select("*")
.eq(
"id",
id
)
.single();

if(productError)
throw productError;


/* الصور */

const {data:images,error:imagesError} =
await client
.from("product_images")
.select("*")
.eq(
"product_id",
id
);

if(imagesError)
throw imagesError;


/* حذف ملفات الصور */

for(const image of (images || [])){

await deleteStorageFile(
"product-images",
image.image_url
);

}


/* حذف الفيديو */

if(product.video_url){

await deleteStorageFile(
"product-videos",
product.video_url
);

}


/* حذف المنتج */

const {error} =
await client
.from("products")
.delete()
.eq(
"id",
id
);

if(error)
throw error;

alert(
"✅ تم حذف المنتج وكل ملفاته"
);

await loadProducts();

}catch(error){

alert(
"❌ فشل حذف المنتج: "+
error.message
);

}

}

/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replaceAll(
"&",
"&amp;"
)
.replaceAll(
"<",
"&lt;"
)
.replaceAll(
">",
"&gt;"
)
.replaceAll(
'"',
"&quot;"
)
.replaceAll(
"'",
"&#039;"
);

}

function escapeAttr(value){

return escapeHtml(value);

}
