<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم - مكتبة ماما زوزو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#222}
header{background:linear-gradient(135deg,#7c3aed,#ec4899);color:white;padding:25px;text-align:center}
.container{max-width:1100px;margin:auto;padding:15px}
.box{background:white;padding:20px;margin:15px 0;border-radius:18px;box-shadow:0 5px 20px #0001}
input,textarea,select{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
button{border:0;padding:12px 18px;margin:5px;border-radius:10px;background:#7c3aed;color:white;cursor:pointer}
.red{background:#dc2626}.green{background:#16a34a}.black{background:#111827}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.card{background:#fafafa;border:1px solid #eee;border-radius:15px;padding:15px}
.msg{padding:12px;margin-top:10px;border-radius:10px;background:#fff3cd}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:right}
</style>
</head>

<body>

<header>
<h1>🛍️ مكتبة ماما زوزو</h1>
<p>لوحة تحكم الإدارة</p>
</header>

<div class="container">

<div id="loginBox" class="box">
<h2>🔐 تسجيل دخول الأدمن</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<div id="loginMsg"></div>
</div>

<div id="dashboard" class="hidden">

<div class="box">
<h2>👋 أهلاً بيك في لوحة التحكم</h2>
<button class="black" onclick="logout()">تسجيل الخروج</button>
</div>

<div class="grid">

<div class="card">
<h3>📦 المنتجات</h3>
<h2 id="productsCount">0</h2>
</div>

<div class="card">
<h3>🛒 الطلبات</h3>
<h2 id="ordersCount">0</h2>
</div>

<div class="card">
<h3>💬 الشكاوى</h3>
<h2 id="complaintsCount">0</h2>
</div>

</div>

<div class="box">

<h2>➕ إضافة منتج</h2>

<input id="productName" placeholder="اسم المنتج">
<input id="productPrice" type="number" placeholder="السعر">
<input id="oldPrice" type="number" placeholder="السعر القديم">
<input id="productStock" type="number" placeholder="الكمية">
<input id="productCategory" placeholder="القسم">

<textarea id="productDescription" placeholder="وصف المنتج"></textarea>

<input id="productImage" placeholder="رابط صورة المنتج">
<input id="productVideo" placeholder="رابط فيديو المنتج">

<button class="green" onclick="addProduct()">إضافة المنتج</button>

<div id="productMsg"></div>
</div>

<div class="box">
<h2>📦 المنتجات</h2>
<button onclick="loadProducts()">🔄 تحديث</button>
<div id="productsList"></div>
</div>

<div class="box">
<h2>🛒 الطلبات</h2>
<button onclick="loadOrders()">🔄 تحديث الطلبات</button>
<div id="ordersList"></div>
</div>

<div class="box">
<h2>💬 الشكاوى والاقتراحات</h2>
<button onclick="loadComplaints()">🔄 تحديث</button>
<div id="complaintsList"></div>
</div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://tzjtivfzawffqgisrowv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2YSBOnUllXOqAztJ70MxeA_gZzD_l0i";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("loginMsg");

if(!email || !password){
msg.innerHTML =
"<div class='msg'>⚠️ اكتب الإيميل وكلمة المرور</div>";
return;
}

const {data,error} =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){
console.error(error);
msg.innerHTML =
"<div class='msg'>❌ بيانات الدخول غير صحيحة</div>";
return;
}

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

await loadAll();
}

async function logout(){
await db.auth.signOut();
location.reload();
}

async function loadAll(){
await loadProducts();
await loadOrders();
await loadComplaints();
}

async function loadProducts(){

const {data,error} =
await db.from("products")
.select("*")
.order("created_at",{ascending:false});

if(error){
console.error(error);
document.getElementById("productsList").innerHTML =
"<div class='msg'>❌ لا يمكن تحميل المنتجات</div>";
return;
}

const products=data||[];

document.getElementById("productsCount").innerText=
products.length;

if(products.length===0){
document.getElementById("productsList").innerHTML=
"<p>لا توجد منتجات حتى الآن.</p>";
return;
}

let html="";

products.forEach(p=>{

html+=`
<div class="card">

<h3>${safe(p.name)}</h3>

<p>💰 السعر:
<strong>${p.price}</strong> جنيه</p>

<p>📦 المخزون: ${p.stock}</p>

<p>🏷️ القسم:
${safe(p.category||"-")}</p>

<button class="red"
onclick="deleteProduct(${p.id})">
🗑️ حذف
</button>

</div>
`;

});

document.getElementById("productsList").innerHTML=
`<div class="grid">${html}</div>`;
}

async function addProduct(){

const product={
name:document.getElementById("productName").value.trim(),
price:Number(document.getElementById("productPrice").value),
old_price:Number(document.getElementById("oldPrice").value)||null,
stock:Number(document.getElementById("productStock").value)||0,
category:document.getElementById("productCategory").value.trim(),
description:document.getElementById("productDescription").value.trim(),
image_url:document.getElementById("productImage").value.trim(),
video_url:document.getElementById("productVideo").value.trim()
};

if(!product.name||!product.price){
document.getElementById("productMsg").innerHTML=
"<div class='msg'>⚠️ اكتب اسم المنتج والسعر</div>";
return;
}

const {error}=await db
.from("products")
.insert(product);

if(error){
console.error(error);
document.getElementById("productMsg").innerHTML=
"<div class='msg'>❌ لم تتم إضافة المنتج</div>";
return;
}

document.getElementById("productMsg").innerHTML=
"<div class='msg'>✅ تمت إضافة المنتج</div>";

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("oldPrice").value="";
document.getElementById("productStock").value="";
document.getElementById("productCategory").value="";
document.getElementById("productDescription").value="";
document.getElementById("productImage").value="";
document.getElementById("productVideo").value="";

await loadProducts();
}

async function deleteProduct(id){

if(!confirm("هل تريد حذف المنتج؟")) return;

const {error}=await db
.from("products")
.delete()
.eq("id",id);

if(error){
alert("❌ لا توجد صلاحية لحذف المنتج");
console.error(error);
return;
}

await loadProducts();
}

async function loadOrders(){

const {data,error}=await db
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(error){
console.error(error);
document.getElementById("ordersList").innerHTML=
"<div class='msg'>❌ لا يمكن تحميل الطلبات</div>";
return;
}

const orders=data||[];

document.getElementById("ordersCount").innerText=
orders.length;

if(!orders.length){
document.getElementById("ordersList").innerHTML=
"<p>لا توجد طلبات.</p>";
return;
}

let html=`
<table>
<tr>
<th>رقم</th>
<th>العميل</th>
<th>الهاتف</th>
<th>الإجمالي</th>
<th>الحالة</th>
</tr>
`;

orders.forEach(o=>{

html+=`
<tr>

<td>${o.id}</td>

<td>${safe(o.customer_name)}</td>

<td>${safe(o.phone)}</td>

<td>${o.total} جنيه</td>

<td>

<select
onchange="changeStatus(${o.id},this.value)">

<option value="pending"
${o.status==="pending"?"selected":""}>
جديد
</option>

<option value="confirmed"
${o.status==="confirmed"?"selected":""}>
تم التأكيد
</option>

<option value="shipped"
${o.status==="shipped"?"selected":""}>
تم الشحن
</option>

<option value="delivered"
${o.status==="delivered"?"selected":""}>
تم التسليم
</option>

<option value="cancelled"
${o.status==="cancelled"?"selected":""}>
ملغي
</option>

</select>

</td>

</tr>
`;

});

html+="</table>";

document.getElementById("ordersList").innerHTML=html;
}

async function changeStatus(id,status){

const {error}=await db
.from("orders")
.update({status:status})
.eq("id",id);

if(error){
alert("❌ لا توجد صلاحية لتعديل الطلب");
console.error(error);
return;
}

alert("✅ تم تحديث حالة الطلب");
}

async function loadComplaints(){

const {data,error}=await db
.from("complaints")
.select("*")
.order("created_at",{ascending:false});

if(error){
console.error(error);
document.getElementById("complaintsList").innerHTML=
"<div class='msg'>❌ لا يمكن تحميل الشكاوى</div>";
return;
}

const complaints=data||[];

document.getElementById("complaintsCount").innerText=
complaints.length;

if(!complaints.length){
document.getElementById("complaintsList").innerHTML=
"<p>لا توجد شكاوى.</p>";
return;
}

let html="";

complaints.forEach(c=>{

html+=`
<div class="card">

<h3>👤 ${safe(c.name||"عميل")}</h3>

<p>📞 ${safe(c.phone||"-")}</p>

<p>💬 ${safe(c.message)}</p>

<p>الحالة:
<strong>${safe(c.status||"new")}</strong>
</p>

</div>
`;

});

document.getElementById("complaintsList").innerHTML=
`<div class="grid">${html}</div>`;
}

function safe(text){

if(text===null||text===undefined) return "";

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

async function checkSession(){

const {data}=await db.auth.getSession();

if(data.session){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

await loadAll();
}
}

checkSession();

</script>

</body>
</html>
