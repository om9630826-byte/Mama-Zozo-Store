<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة ماما زوزو 🧸</title>

<style>
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#fffaf2;
color:#263b55;
}
.top{
background:#263b55;
color:white;
text-align:center;
padding:10px;
}
header{
background:white;
padding:18px;
display:flex;
align-items:center;
justify-content:space-around;
gap:15px;
box-shadow:0 2px 10px #ddd;
}
.logo{
font-size:25px;
font-weight:bold;
}
.logo span{color:#e9aa27}
.search{
padding:12px 20px;
border:2px solid #eee;
border-radius:25px;
width:40%;
}
.cart{
background:#f4b942;
border:0;
padding:12px 20px;
border-radius:25px;
font-weight:bold;
}
nav{
background:#263b55;
color:white;
text-align:center;
padding:12px;
}
nav a{
color:white;
text-decoration:none;
margin:0 15px;
}
.hero{
margin:30px 6%;
padding:45px;
border-radius:30px;
background:linear-gradient(135deg,#dff3f6,#fff0c7);
text-align:center;
}
.hero h1{
font-size:42px;
margin:10px;
}
.hero span{color:#e9aa27}
.hero p{
font-size:18px;
color:#536273;
}
.btn{
display:inline-block;
background:#263b55;
color:white;
padding:13px 25px;
border-radius:25px;
text-decoration:none;
margin-top:10px;
}
section{
padding:20px 6%;
}
h2{
font-size:28px;
}
.categories,.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}
.card,.product{
background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 4px 15px #00000012;
}
.icon{
font-size:50px;
}
.product{
padding:0 0 18px;
overflow:hidden;
}
.product .pic{
font-size:75px;
background:#f3f8fa;
padding:25px;
}
.product h3{
margin:12px;
}
.price{
color:#e2a321;
font-weight:bold;
font-size:20px;
}
.add{
background:#263b55;
color:white;
border:0;
padding:10px 20px;
border-radius:12px;
margin-top:10px;
}
.contact{
background:#263b55;
color:white;
margin-top:30px;
padding:35px 6%;
}
.contact h2{color:#f4b942}
footer{
background:#192b3e;
color:white;
text-align:center;
padding:18px;
}

@media(max-width:700px){
header{
flex-wrap:wrap;
}
.search{
width:80%;
order:3;
}
.categories,.products{
grid-template-columns:repeat(2,1fr);
}
.hero h1{
font-size:30px;
}
nav{
overflow:auto;
white-space:nowrap;
}
}
</style>
</head>

<body>

<div class="top">
🎒 كل اللي يحتاجه ابنك للمدرسة واللعب في مكان واحد
</div>

<header>
<div class="logo">
مكتبة <span>ماما زوزو</span> 🧸
</div>

<input class="search" id="search"
placeholder="🔍 ابحث عن منتج...">

<button class="cart" onclick="showCart()">
🛒 السلة (<span id="count">0</span>)
</button>
</header>

<nav>
<a href="#">الرئيسية</a>
<a href="#categories">الأقسام</a>
<a href="#products">المنتجات</a>
<a href="#contact">تواصل معنا</a>
</nav>

<div class="hero">
<h1>
كل حاجة حلوة عند <span>ماما زوزو</span> 💛
