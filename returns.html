<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المرتجعات والاستبدالات - مكتبة ماما زوزو</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Tahoma,sans-serif;
      background:#f5f7fb;
      color:#222;
    }

    header{
      background:#fff;
      padding:20px;
      text-align:center;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    header h1{
      margin:0;
      color:#1976d2;
      font-size:24px;
    }

    .container{
      width:min(700px,92%);
      margin:35px auto;
    }

    .card{
      background:#fff;
      padding:25px;
      border-radius:16px;
      box-shadow:0 4px 20px rgba(0,0,0,.08);
    }

    h2{
      text-align:center;
      margin-top:0;
    }

    label{
      display:block;
      margin:16px 0 7px;
      font-weight:bold;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px;
      font-family:inherit;
    }

    textarea{
      min-height:120px;
      resize:vertical;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#1976d2;
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      opacity:.9;
    }

    .back{
      background:#555;
    }

    .info{
      background:#eef6ff;
      border-radius:10px;
      padding:14px;
      line-height:1.8;
      color:#174a7c;
      margin-bottom:20px;
    }

    #message{
      margin-top:18px;
      padding:12px;
      border-radius:10px;
      display:none;
      line-height:1.7;
    }

    .success{
      display:block !important;
      background:#d1e7dd;
      color:#0f5132;
    }

    .error{
      display:block !important;
      background:#f8d7da;
      color:#842029;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 مكتبة ماما زوزو</h1>
</header>

<main class="container">

  <div class="card">

    <h2>🔄 المرتجعات والاستبدالات</h2>

    <div class="info">
      بعد استلام الطلب، تقدر تقدم طلب مرتجع أو استبدال من هنا.
      <br>
      اكتب البيانات بدقة عشان الإدارة تقدر تراجع الطلب.
    </div>

    <form id="returnForm">

      <label for="orderId">
        رقم الطلب
      </label>

      <input
        id="orderId"
        type="number"
        min="1"
        placeholder="مثال: 25"
        required
      >

      <label for="customerName">
        الاسم
      </label>

      <input
        id="customerName"
        type="text"
        placeholder="اكتب اسمك"
        required
      >

      <label for="phone">
        رقم الموبايل
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="01012345678"
        required
      >

      <label for="productName">
        اسم المنتج
      </label>

      <input
        id="productName"
        type="text"
        placeholder="اكتب اسم المنتج"
        required
      >

      <label for="productId">
        رقم المنتج
      </label>

      <input
        id="productId"
        type="number"
        min="1"
        placeholder="لو مش عارفه سيبه فاضي"
      >

      <label for="quantity">
        الكمية
      </label>

      <input
        id="quantity"
        type="number"
        min="1"
        value="1"
        required
      >

      <label for="requestType">
        نوع الطلب
      </label>

      <select id="requestType" required>

        <option value="">
          اختر نوع الطلب
        </option>

        <option value="return">
          🔄 مرتجع
        </option>

        <option value="exchange">
          🔁 استبدال
        </option>

      </select>

      <label for="reason">
        سبب المرتجع أو الاستبدال
      </label>

      <textarea
        id="reason"
        placeholder="اكتب السبب بالتفصيل"
        required
      ></textarea>

      <button type="submit">
        📤 إرسال الطلب
      </button>

    </form>

    <div id="message"></div>

    <button
      class="back"
      onclick="window.location.href='index.html'"
    >
      🏠 العودة للمتجر
    </button>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://tzjtivfzawffqgisrowt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_2YSBOnUllXOqAztJ70mxeA_gZzD_l0i";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const form =
    document.getElementById("returnForm");

  const messageBox =
    document.getElementById("message");


  function showMessage(text,type){

    messageBox.textContent = text;

    messageBox.className = type;

  }


  form.addEventListener("submit",async function(e){

    e.preventDefault();

    messageBox.className = "";
    messageBox.textContent = "";


    const orderId =
      Number(
        document.getElementById("orderId").value
      );

    const customerName =
      document
        .getElementById("customerName")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const productName =
      document
        .getElementById("productName")
        .value
        .trim();

    const productIdValue =
      document
        .getElementById("productId")
        .value
        .trim();

    const productId =
      productIdValue
      ? Number(productIdValue)
      : null;

    const quantity =
      Number(
        document.getElementById("quantity").value
      );

    const requestType =
      document.getElementById("requestType").value;

    const reason =
      document
        .getElementById("reason")
        .value
        .trim();


    if(!orderId ||
       !customerName ||
       !phone ||
       !productName ||
       !quantity ||
       !requestType ||
       !reason){

      showMessage(
        "⚠️ كمّل كل البيانات المطلوبة الأول",
        "error"
      );

      return;
    }


    if(quantity < 1){

      showMessage(
        "⚠️ الكمية لازم تكون 1 أو أكتر",
        "error"
      );

      return;
    }


    try{

      const { error } =
        await supabaseClient
          .from("returns")
          .insert({

            order_id:orderId,

            product_id:productId,

            product_name:productName,

            customer_name:customerName,

            phone:phone,

            request_type:requestType,

            quantity:quantity,

            reason:reason,

            status:"new"

          });


      if(error)
        throw error;


      form.reset();

      document.getElementById("quantity").value = 1;

      showMessage(
        "✅ تم إرسال طلب المرتجع/الاستبدال بنجاح",
        "success"
      );


    }catch(error){

      console.error(
        "returns error:",
        error
      );

      showMessage(
        "❌ حصل خطأ: " + error.message,
        "error"
      );

    }

  });

</script>

</body>
</html>
