<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>متابعة الشكوى - مكتبة ماما زوزو</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Tahoma,sans-serif;
      background:#f5f7fb;
      color:#222;
    }

    .header{
      background:#fff;
      padding:20px;
      text-align:center;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .header h1{
      margin:0;
      color:#1976d2;
      font-size:24px;
    }

    .container{
      width:min(600px,92%);
      margin:40px auto;
    }

    .card{
      background:#fff;
      padding:25px;
      border-radius:16px;
      box-shadow:0 4px 20px rgba(0,0,0,.08);
    }

    h2{
      margin-top:0;
      text-align:center;
    }

    label{
      display:block;
      margin:15px 0 7px;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:16px;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#1976d2;
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      opacity:.9;
    }

    .result{
      margin-top:25px;
    }

    .complaint{
      border:1px solid #e2e6ec;
      border-radius:12px;
      padding:16px;
      margin-top:15px;
      background:#fafafa;
    }

    .status{
      display:inline-block;
      padding:6px 12px;
      border-radius:20px;
      background:#eee;
      margin-bottom:10px;
      font-weight:bold;
    }

    .new{
      background:#fff3cd;
      color:#856404;
    }

    .in_progress{
      background:#cfe2ff;
      color:#084298;
    }

    .resolved{
      background:#d1e7dd;
      color:#0f5132;
    }

    .closed{
      background:#e2e3e5;
      color:#41464b;
    }

    .message{
      white-space:pre-wrap;
      line-height:1.8;
      background:#fff;
      padding:12px;
      border-radius:8px;
      margin-top:10px;
    }

    .reply{
      margin-top:12px;
      padding:12px;
      background:#e8f5e9;
      border-radius:8px;
      white-space:pre-wrap;
      line-height:1.8;
    }

    .empty{
      text-align:center;
      padding:20px;
      color:#777;
    }

    .back{
      background:#555;
      margin-top:10px;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>📚 مكتبة ماما زوزو</h1>
  </header>

  <main class="container">

    <div class="card">

      <h2>📝 متابعة الشكوى</h2>

      <p style="text-align:center;color:#666;">
        اكتب رقم الموبايل اللي استخدمته عند إرسال الشكوى
      </p>

      <label for="phone">رقم الموبايل</label>

      <input
        id="phone"
        type="tel"
        placeholder="مثال: 01012345678"
        autocomplete="tel"
      >

      <button onclick="searchComplaints()">
        🔎 متابعة الشكاوى
      </button>

      <button
        class="back"
        onclick="window.location.href='index.html'"
      >
        🏠 العودة للمتجر
      </button>

      <div id="result" class="result"></div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://tzjtivfzawffqgisrowt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_2YSBOnUllXOqAztJ70mxeA_gZzD_l0i";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function escapeHtml(value){

      return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
    }


    function statusText(status){

      const statuses = {

        new:"🆕 جديدة",

        in_progress:"🔄 قيد المراجعة",

        resolved:"✅ تم الحل",

        closed:"🔒 مغلقة"

      };

      return statuses[status] || status || "غير محددة";
    }


    async function searchComplaints(){

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();

      const result =
        document.getElementById("result");


      if(!phone){

        result.innerHTML =
          '<div class="empty">⚠️ اكتب رقم الموبايل الأول</div>';

        return;
      }


      result.innerHTML =
        '<div class="empty">⏳ جاري البحث...</div>';


      try{

        const { data, error } =
          await supabaseClient

            .from("complaints")

            .select(`
              id,
              name,
              phone,
              message,
              status,
              admin_reply,
              created_at
            `)

            .eq("phone",phone)

            .order("created_at",{
              ascending:false
            });


        if(error)
          throw error;


        if(!data || data.length === 0){

          result.innerHTML =
            '<div class="empty">❌ مفيش شكاوى مسجلة بالرقم ده</div>';

          return;
        }


        result.innerHTML =
          data.map(item => {

            const date =
              new Date(
                item.created_at
              ).toLocaleString("ar-EG");


            return `

              <div class="complaint">

                <div class="status ${escapeHtml(item.status)}">

                  ${escapeHtml(
                    statusText(item.status)
                  )}

                </div>

                <div>
                  <strong>📅 التاريخ:</strong>
                  ${escapeHtml(date)}
                </div>

                <div class="message">

                  <strong>💬 الرسالة:</strong>

                  ${escapeHtml(
                    item.message
                  )}

                </div>

                ${
                  item.admin_reply
                  ?
                  `
                    <div class="reply">

                      <strong>👨‍💼 رد الإدارة:</strong>

                      ${escapeHtml(
                        item.admin_reply
                      )}

                    </div>
                  `
                  :
                  `
                    <div
                      style="
                        margin-top:12px;
                        color:#777;
                      "
                    >
                      ⏳ لسه مفيش رد من الإدارة
                    </div>
                  `
                }

              </div>

            `;

          }).join("");


      }catch(error){

        console.error(
          "searchComplaints error:",
          error
        );

        result.innerHTML = `

          <div class="empty">

            ❌ حصل خطأ أثناء البحث

            <br><br>

            ${escapeHtml(error.message)}

          </div>

        `;

      }

    }

  </script>

</body>
</html>
